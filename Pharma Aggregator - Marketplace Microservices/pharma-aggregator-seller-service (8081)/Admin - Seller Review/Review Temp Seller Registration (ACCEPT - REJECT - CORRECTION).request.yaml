$kind: http-request
name: Review Temp Seller Registration (ACCEPT / REJECT / CORRECTION)
description: status must be one of ACCEPT, REJECT, CORRECTION.
url: "{{baseUrl}}/admin/sellers/review"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id": {{tempSellerId}},
      "status": "ACCEPT",
      "comments": "All documents verified, approving registration."
    }
order: 1000
