$kind: http-request
description: Step 1 of login. On success, an OTP is emailed to the account and an OtpSentResponse is returned.
url: "{{baseUrl}}/authentication/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: // No token yet at this step — OTP is emailed. Nothing to save here.
    language: text/javascript
order: 1000
