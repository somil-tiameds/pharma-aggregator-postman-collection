$kind: http-request
description: Every field is optional here — used to persist a partial registration form (save-and-continue-later UX).
url: "{{baseUrl}}/temp-sellers/draft"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "sellerName": "Acme Pharma Distributors",
      "phone": "{{phone}}",
      "email": "{{email}}"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201 || pm.response.code === 200) {
          const body = pm.response.json();
          if (body.tempSellerId) { pm.collectionVariables.set('tempSellerId', body.tempSellerId); }
          if (body.id) { pm.collectionVariables.set('tempSellerId', body.id); }
      }
    language: text/javascript
order: 1000
