$kind: http-request
description: Creates a signup OTP request and emails an OTP to the given address. Does not create the User yet — see verify-otp.
url: "{{baseUrl}}/auth/signup"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fullName": "Jane Seller",
      "email": "{{email}}",
      "password": "{{password}}"
    }
order: 1000
