$kind: http-request
description: All parts are optional and independent — attach only the files you're updating. licenseFiles/licenseNames/documentIds are parallel arrays for product-tied license documents.
url: "{{baseUrl}}/temp-sellers/{{tempSellerId}}/documents/upload"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: sellerImage
      src: []
    - type: file
      key: gstFile
      src: []
    - type: file
      key: bankFile
      src: []
    - type: file
      key: companyRegistrationCertificate
      src: []
    - type: file
      key: authorizationLetter
      src: []
    - type: file
      key: licenseFiles
      src: []
    - type: text
      key: licenseNames
      value: Drug Manufacturing Licence
    - type: text
      key: documentIds
      value: "{{documentId}}"
order: 1000
