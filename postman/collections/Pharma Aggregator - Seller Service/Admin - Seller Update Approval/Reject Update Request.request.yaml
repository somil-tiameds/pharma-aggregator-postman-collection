$kind: http-request
url: "{{baseUrl}}/admin/seller-requests/{{pendingSellerId}}/reject"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "pendingSellerId": {{pendingSellerId}},
      "action": "REJECT",
      "rejectionReason": "Bank document illegible, please re-upload.",
      "approvedBy": "{{approvedBy}}"
    }
settings: {}
order: 5000
