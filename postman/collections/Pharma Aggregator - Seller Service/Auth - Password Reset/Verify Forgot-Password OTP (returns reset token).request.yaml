$kind: http-request
url: "{{baseUrl}}/auth/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "otp": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          const body = pm.response.json();
          const token = body && body.data && body.data.resetToken;
          if (token) { pm.collectionVariables.set('passwordResetToken', token); }
      }
    language: text/javascript
settings: {}
order: 3000
