$kind: collection
description: |-
  Full endpoint coverage for pharma-aggregator-seller-service (Seller User domain microservice, extracted from pharma-aggregator-server per docs/v.0.2/HLD-v0_2.pdf). Base URL has no context-path (unlike the monolith's /api/v1) — this service listens directly on {{baseUrl}}.

  Flow guide:
  1. Auth - Signup: create a User account (email OTP verified) via /auth/signup.
  2. Auth - Login (Password + OTP): POST /authentication/login then /authentication/verify-otp — the verify-otp response test script auto-saves accessToken/refreshToken as collection variables, so every other request's Bearer auth just works afterward.
  3. Temp Seller Registration: submit a full registration (or use the Draft flow to save partial data), upload documents, then use Admin - Seller Approval endpoints to approve/reject.
  4. Seller Profile: once a seller is live, use these endpoints to view/update/delete.
variables:
  baseUrl: http://localhost:8080
  accessToken: ""
  refreshToken: ""
  username: seller_user@example.com
  password: Passw0rd!123
  userId: "1"
  sellerId: SEL-0001
  pendingSellerId: "1"
  tempSellerId: "1"
  documentId: "1"
  ifscCode: HDFC0000001
  phone: "9876543210"
  email: seller_user@example.com
  approvedBy: admin@tiameds.ai
auth:
  - id: 51152688-623d-4eea-8551-ef428744b519
    type: bearer
    name: bearer auth
    credentials:
      token: "{{accessToken}}"
