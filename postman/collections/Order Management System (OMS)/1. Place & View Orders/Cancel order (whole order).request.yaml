$kind: http-request
description: "Only permitted while every child SellerOrder is still PLACED/CONFIRMED/PACKED. Reverses the stock debit and, if payment already succeeded, opens a Refund in REQUESTED. actorRole/actorId is now ownership-checked: BUYER must match the order's real buyerId (401 otherwise) — SELLER is rejected outright here (a whole-order cancel can span multiple sellers, so a seller must use the seller-order-specific cancel below instead) — ADMIN is unrestricted."
url: "{{baseUrl}}/orders/{{orderId}}/cancel"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "actorRole": "BUYER",
      "actorId": "{{buyerId}}",
      "reason": "Changed my mind"
    }
settings: {}
order: 4000
