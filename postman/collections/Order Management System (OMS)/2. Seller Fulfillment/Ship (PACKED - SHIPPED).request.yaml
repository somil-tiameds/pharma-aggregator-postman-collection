$kind: http-request
name: Ship (PACKED -> SHIPPED)
url: "{{baseUrl}}/seller-orders/{{sellerOrderId}}/ship"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "sellerId": "{{sellerId}}",
      "courierName": "BlueDart",
      "trackingNumber": "BD123456789",
      "trackingUrl": "https://bluedart.com/track/BD123456789"
    }
settings: {}
order: 5000
