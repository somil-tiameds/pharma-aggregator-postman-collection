$kind: http-request
name: Confirm (PLACED -> CONFIRMED)
description: Body is just {sellerId} for confirm/pack/out-for-delivery/deliver/cancel — used only for the ownership check.
url: "{{baseUrl}}/seller-orders/{{sellerOrderId}}/confirm"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "sellerId": "{{sellerId}}"
    }
settings: {}
order: 3000
