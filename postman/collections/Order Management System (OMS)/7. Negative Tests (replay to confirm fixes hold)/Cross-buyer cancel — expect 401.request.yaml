$kind: http-request
description: Swap in an orderId and a buyerId that genuinely don't match. Before the fix this silently succeeded and cancelled the order; now expect HTTP 401 with 'Order ... does not belong to buyer ...'. Same pattern applies to PATCH /seller-orders/{id}/cancel with a mismatched sellerId or buyerId.
url: "{{baseUrl}}/orders/{{orderId}}/cancel"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "actorRole": "BUYER",
      "actorId": "SOMEONE-ELSES-BUYER-ID",
      "reason": "not mine"
    }
settings: {}
order: 1000
