$kind: http-request
description: Only allowed once the SellerOrder has reached at least SHIPPED. Uploads a real PDF via the existing S3Service/PdfService — invoiceNumber format is INV-{sellerId}-{FY}-{sequence}, e.g. INV-PRMFG0037-2627-00001, sequential per seller per Indian financial year (April-March).
url: "{{baseUrl}}/invoices/generate/{{sellerOrderId}}"
method: POST
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        const body = pm.response.json().data;
        if (body.invoiceId) pm.collectionVariables.set('invoiceId', String(body.invoiceId));
      }
    language: text/javascript
settings: {}
order: 1000
