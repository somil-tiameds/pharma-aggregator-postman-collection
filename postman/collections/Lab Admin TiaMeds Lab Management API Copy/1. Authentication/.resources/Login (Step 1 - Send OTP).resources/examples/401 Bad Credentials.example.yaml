$kind: http-example
request:
  url: "{{baseUrl}}/auth/login"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "username": "deep",
        "password": "Seller@123"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: |-
      {
        "status": "error",
        "message": "Incorrect username or password",
        "data": null
      }
order: 2000
