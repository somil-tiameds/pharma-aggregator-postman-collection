$kind: http-example
request:
  url: "{{baseUrl}}/auth/refresh"
  method: POST
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "status": "success",
        "message": "Token refreshed successfully",
        "data": { "username": "johndoe", "email": "admin@example.com", "roles": ["ROLE_ADMIN"] }
      }
order: 1000
