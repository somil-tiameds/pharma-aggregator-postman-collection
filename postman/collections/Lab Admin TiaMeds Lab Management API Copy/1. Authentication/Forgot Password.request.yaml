$kind: http-request
description: Initiates password reset flow. Sends reset link to email if account exists. Always returns 200 to prevent user enumeration. Rate limited per email and IP.
url: "{{baseUrl}}/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "user@example.com"
    }
settings: {}
order: 7000
