$kind: http-request
description: Lab admin resets a specific member's password.
url: "{{baseUrl}}/user-management/reset-password/{{labId}}/{{userId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "newPassword": "NewTemp@12345"
    }
settings: {}
order: 4000
