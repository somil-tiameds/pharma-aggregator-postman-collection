$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/products/batch"
  method: DELETE
  body:
    type: json
    content: |-
      {
        "productIds": ["prd_01", "prd_02", "prd_03"]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "requested": 3,
        "deleted": ["prd_01", "prd_02"],
        "notFound": ["prd_03"]
      }
order: 1000
