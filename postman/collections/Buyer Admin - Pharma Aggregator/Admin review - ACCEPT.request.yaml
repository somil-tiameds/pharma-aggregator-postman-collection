$kind: http-request
description: "On ACCEPT: creates the real Buyer profile (generated buyerId), migrates temp S3 files, marks TempBuyer status APPROVED, sends a best-effort approval email."
url: "{{baseUrl}}/admin/buyers/review"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id": {{tempBuyerId}},
      "status": "ACCEPT",
      "comments": "All documents verified, approving registration"
    }
settings: {}
order: 7000
