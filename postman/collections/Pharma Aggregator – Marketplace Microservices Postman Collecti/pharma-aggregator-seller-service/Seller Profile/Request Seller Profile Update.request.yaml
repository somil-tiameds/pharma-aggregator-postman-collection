    {
      "sellerName": "Acme Pharma Distributors Pvt Ltd",
      "companyTypeId": 1,
      "sellerTypeId": 1,
      "phone": "{{phone}}",
      "email": "{{email}}",
      "website": "https://acmepharma.example.com",
      "termsAccepted": true,
      "address": {
        "stateId": 1,
        "districtId": 1,
        "talukaId": 1,
        "city": "Mumbai",
        "street": "MG Road",
        "buildingNo": "12-A",
        "pinCode": "400001"
      },
      "coordinator": {
        "name": "Rahul Sharma",
        "designation": "Operations Manager",
        "email": "rahul.sharma@acmepharma.example.com",
        "mobile": "9876500000"
      },
      "bankDetails": {
        "bankName": "HDFC Bank",
        "branch": "Andheri West",
        "ifscCode": "HDFC0000123",
        "accountNumber": "123456789012",
        "accountHolderName": "Acme Pharma Distributors"
      },
      "gstNumber": "27ABCDE1234F1Z5",
