  ## Environment Variables

  Create a Postman **Environment** named `Pharma Aggregator - Local` with the following variables:

  | Variable | Description | Example Value |
  | --- | --- | --- |
  | `gateway_url` | API Gateway base URL | `http://localhost:8089` |
  | `buyer_service_url` | Direct Buyer Service URL | `http://localhost:8081` |
  | `seller_service_url` | Direct Seller Service URL | `http://localhost:8082` |
  | `product_service_url` | Direct Product Service URL | `http://localhost:8083` |
  | `order_service_url` | Direct Order Service URL | `http://localhost:8084` |
  | `quotation_service_url` | Direct Quotation Service URL | `http://localhost:8085` |
  | `search_service_url` | Direct Search Service URL | `http://localhost:8086` |
  | `billing_service_url` | Direct Billing Service URL | `http://localhost:8087` |
  | `notification_service_url` | Direct Notification Service URL | `http://localhost:8088` |
  | `registry_url` | Service Registry (Eureka) URL | `http://localhost:8090` |
  | `config_server_url` | Config Server URL | `http://localhost:8091` |
  | `auth_token` | JWT bearer token (set after login) | `{{token}}` |
  | `buyer_id` | Sample buyer ID for chained requests | `1` |
  | `seller_id` | Sample seller ID for chained requests | `1` |
  | `product_id` | Sample product ID for chained requests | `1` |
  | `order_id` | Sample order ID for chained requests | `1` |

  > 

  💡 **Best Practice:** Use `{{gateway_url}}` as the base URL for all requests so traffic flows through the Gateway (mirroring production routing). Keep the individual `\*_service_url` variables available for direct, isolated debugging of a single service.

   
    

