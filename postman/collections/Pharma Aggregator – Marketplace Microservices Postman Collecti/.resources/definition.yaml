  ## Project Overview

  **Pharma Aggregator** is a B2B pharmaceutical marketplace platform built on a microservices architecture. It connects **buyers** (pharmacies, hospitals, distributors) with **sellers** (manufacturers, wholesalers) — enabling product discovery, price quotation/negotiation, ordering, billing, and notifications, all coordinated through a central API Gateway with service discovery and externalized configuration.

  ---

  ## Architecture

  ```
                          ┌─────────────────────┐
                          │   Config Server      │  (8091 / DB 5443)
                          └──────────┬───────────┘
                                     │  pulls config
                          ┌──────────▼───────────┐
                          │  Service Registry     │  (8090 / DB 5442)
                          │      (Eureka)         │
                          └──────────┬───────────┘
                                     │  registers/discovers
       ┌─────────────────────────────┼─────────────────────────────┐
       │                             │                             │
  ┌────▼─────┐  ┌─────────┐  ┌───────▼──────┐  ┌────────┐  ┌───────▼───────┐
  │  Buyer   │  │ Seller  │  │   Product     │  │ Order  │  │  Quotation    │
  │ Service  │  │ Service │  │   Service     │  │Service │  │   Service     │
  │  8081    │  │  8082   │  │    8083       │  │  8084  │  │    8085       │
  └──────────┘  └─────────┘  └──────────────┘  └────────┘  └───────────────┘
       │                             │                             │
  ┌────▼─────┐  ┌─────────────┐  ┌───▼────────┐
  │  Search  │  │  Billing    │  │Notification│
  │ Service  │  │  Service    │  │  Service   │
  │  8086    │  │   8087      │  │    8088    │
  └──────────┘  └─────────────┘  └────────────┘
                      │
            ┌─────────▼──────────┐
            │    API Gateway      │  (8089 / DB 5441)
            │  (single entry pt)  │
            └─────────┬──────────┘
                       │
                   ┌───▼───┐
                   │ Client │
                   └────────┘

   ```

  **Base URL (via Gateway):** `http://localhost:8089`

  Each service is an independently deployable Spring Boot application with its own dedicated PostgreSQL database (database-per-service pattern) — there is no shared schema between services.

