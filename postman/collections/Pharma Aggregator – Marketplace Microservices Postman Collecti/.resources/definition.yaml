  ### Service Responsibilities

  | Service | Purpose |
  | --- | --- |
  | **Buyer Service** | Buyer registration, profile management, authentication, buyer preferences |
  | **Seller Service** | Seller/vendor onboarding, verification, catalog ownership, seller profiles |
  | **Product Service** | Pharmaceutical product catalog, SKUs, batch/expiry tracking, pricing |
  | **Order Service** | Order creation, status tracking, order history, fulfillment workflow |
  | **Quotation Service** | RFQ (Request for Quotation), price negotiation, quote approvals between buyers & sellers |
  | **Search Service** | Product/seller search, filtering, discovery |
  | **Billing Service** | Invoicing, payment processing, billing history |
  | **Notification Service** | Email/SMS/push notifications for order updates, quotations, and alerts |
  | **API Gateway** | Single entry point; routes all client requests to the correct downstream service |
  | **Service Registry** | Eureka server — service discovery and health monitoring |
  | **Config Server** | Centralized externalized configuration (Spring Cloud Config) for all microservices |

