  ## Authentication

  Most Buyer, Seller, Order, Quotation, and Billing endpoints require a **Bearer Token**, issued after a successful login via the Buyer or Seller authentication endpoint.

  **Collection-level Auth setup:**

  - Type: `Bearer Token`
      
  - Token: `{{auth_token}}`
      

  **Recommended flow:**

  1. Call `Login Buyer` or `Login Seller`.
      
  2. const response = pm.response.json();pm.environment.set("auth_token", response.token);
      
  3. All subsequent requests in the collection automatically inherit `{{auth_token}}`.
      

  ---

  ## Suggested Testing Flow

  1. **Service Registry** — confirm all 9 business services are registered (`GET {{registry_url}}/eureka/apps`)
      
  2. **Config Server** — verify each service can fetch its configuration
      
  3. **Seller Service** — register and log in a seller
      
  4. **Product Service** — seller adds one or more products
      
  5. **Buyer Service** — register and log in a buyer
      
  6. **Search Service** — buyer searches for the newly added product
      
  7. **Quotation Service** — buyer requests a quote → seller responds → buyer approves
      
  8. **Order Service** — buyer places an order from the approved quotation
      
  9. **Billing Service** — generate an invoice and process payment for the order
      
  10. **Notification Service** — verify notifications fired for quotation/order/billing events
      
  11. **API Gateway** — re-run the key requests above through `{{gateway_url}}` to confirm end-to-end routing
      

  ---

  ## Notes & Conventions

  - **Database-per-service**: Each business service owns an isolated PostgreSQL database; no service accesses another's schema directly.
      
  - **Tech stack**: Spring Boot microservices, Spring Cloud Config, Netflix Eureka (Service Registry), Spring Cloud Gateway.
      
  - **Local ports**: All ports listed assume local development. Update environment variables accordingly for staging/production deployments.
      
  - **Naming convention**: Databases follow the pattern `pharma_aggregator__db`.
      
  - **Versioning**: Consider prefixing API paths with a version, e.g. `/api/v1/products`, once the API stabilizes.
      
  - **Error handling**: Standardize error response shape across all services (e.g., `{ "timestamp", "status", "error", "message", "path" }`) for consistent client-side handling in Postman tests.
