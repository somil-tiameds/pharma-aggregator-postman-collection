$kind: http-request
description: Builds DRAFT settlements for the period. Re-running rebuilds an unapproved draft; approved/paid ones are never rebuilt.
url: "{{baseUrl}}/billing/admin/settlements/run"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
body:
  type: json
  content: |-
    {
      "periodFrom": "2026-10-01",
      "periodTo": "2026-10-31",
      "sellerId": "{{sellerId}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is one of [200, 201]', function () { pm.expect([200, 201]).to.include(pm.response.code); });
      var body; try { body = pm.response.json(); } catch (e) { body = null; }
      if (body && body.data) { var v = ((Array.isArray(body.data) ? body.data[0] : body.data).settlementId); if (v !== undefined && v !== null) { pm.collectionVariables.set('settlementId', v); } }
    language: text/javascript
order: 1000
