$kind: http-request
description: Finance confirms the manual transfer; books the ledger and closes the settlement.
url: "{{baseUrl}}/billing/admin/payouts/{{payoutId}}/confirm"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
body:
  type: json
  content: |-
    {
      "utr": "UTR202610060001"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 8000
