$kind: http-request
description: Inbound events that failed repeatedly (open ones).
url: "{{baseUrl}}/billing/admin/events/dead-letter"
method: GET
headers:
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
      var body; try { body = pm.response.json(); } catch (e) { body = null; }
      if (body && body.data) { var v = ((Array.isArray(body.data) ? body.data[0] : (body.data.content || [])[0] || {}).id); if (v !== undefined && v !== null) { pm.collectionVariables.set('deadLetterId', v); } }
    language: text/javascript
order: 4000
