$kind: http-request
url: "{{baseUrl}}/billing/admin/reconciliation/runs"
method: GET
headers:
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
