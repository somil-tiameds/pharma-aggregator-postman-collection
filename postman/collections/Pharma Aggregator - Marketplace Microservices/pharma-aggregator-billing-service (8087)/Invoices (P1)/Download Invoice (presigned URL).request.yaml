$kind: http-request
description: Returns `{url, expiresAt, viaApi}`. 409 while the PDF is still generating. When `viaApi=true` use the /file endpoint.
url: "{{baseUrl}}/billing/invoices/{{invoiceId}}/download"
method: GET
headers:
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
auth:
  type: bearer
  credentials:
    token: "{{buyerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200, 409]', function () { pm.expect([200, 409]).to.include(pm.response.code); });
    language: text/javascript
order: 5000
