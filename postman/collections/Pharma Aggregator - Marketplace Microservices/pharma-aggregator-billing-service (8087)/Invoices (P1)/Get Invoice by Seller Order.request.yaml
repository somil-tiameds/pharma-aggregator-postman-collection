$kind: http-request
description: Same shape as Get Invoice.
url: "{{baseUrl}}/billing/invoices/by-seller-order/{{sellerOrderId}}"
method: GET
headers:
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
auth:
  type: bearer
  credentials:
    token: "{{buyerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
      var body; try { body = pm.response.json(); } catch (e) { body = null; }
      if (body && body.data) { var v = (body.data.invoiceId); if (v !== undefined && v !== null) { pm.collectionVariables.set('invoiceId', v); } }
    language: text/javascript
order: 3000
