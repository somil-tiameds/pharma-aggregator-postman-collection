$kind: http-request
description: Returns `providerOrderId` + `publicKeyId` (publishable key only) for the checkout SDK. 503 when online payments are disabled (`BILLING_GATEWAY_PROVIDER=disabled`).
url: "{{baseUrl}}/billing/payments/initiate"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Idempotency-Key
    value: "{{idempotencyKey}}"
    description: Mandatory/used for money-moving calls. A fresh GUID is generated per send; reuse the same value to test replay.
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
body:
  type: json
  content: |-
    {
      "orderId": "{{orderId}}",
      "method": "ONLINE"
    }
auth:
  type: bearer
  credentials:
    token: "{{buyerToken}}"
scripts:
  - type: beforeRequest
    code: pm.variables.set('idempotencyKey', pm.variables.get('fixedIdempotencyKey') || pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is one of [200, 201, 503]', function () { pm.expect([200, 201, 503]).to.include(pm.response.code); });
      var body; try { body = pm.response.json(); } catch (e) { body = null; }
      if (body && body.data) { var v = (body.data.paymentRef); if (v !== undefined && v !== null) { pm.collectionVariables.set('paymentRef', v); } }
      if (body && body.data && body.data.providerOrderId) pm.collectionVariables.set('providerOrderId', body.data.providerOrderId);
    language: text/javascript
order: 2000
