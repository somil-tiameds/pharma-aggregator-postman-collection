$kind: http-request
description: Verifies the checkout HMAC **and** re-reads the payment at the gateway (status and amount) before capturing. Idempotent. The webhook remains the source of truth.
url: "{{baseUrl}}/billing/payments/{{paymentRef}}/verify"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Idempotency-Key
    value: "{{idempotencyKey}}"
    description: Mandatory/used for money-moving calls. A fresh GUID is generated per send; reuse the same value to test replay.
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
body:
  type: json
  content: |-
    {
      "providerOrderId": "{{providerOrderId}}",
      "providerPaymentId": "{{providerPaymentId}}",
      "signature": "{{providerSignature}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{buyerToken}}"
scripts:
  - type: beforeRequest
    code: pm.variables.set('idempotencyKey', pm.variables.get('fixedIdempotencyKey') || pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
