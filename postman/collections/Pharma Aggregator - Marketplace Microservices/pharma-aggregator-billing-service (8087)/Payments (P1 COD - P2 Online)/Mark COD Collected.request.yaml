$kind: http-request
description: Cash received. All fields optional; `amount`, if given, must equal the amount due (422 otherwise). Idempotent.
url: "{{baseUrl}}/billing/payments/{{paymentRef}}/cod-collected"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: X-Service-Token
    value: "{{serviceToken}}"
    description: Shared service secret (BILLING_SERVICE_TOKEN).
  - key: X-Service-Name
    value: postman
    description: Optional caller name for the audit trail.
  - key: Idempotency-Key
    value: "{{idempotencyKey}}"
    description: Mandatory/used for money-moving calls. A fresh GUID is generated per send; reuse the same value to test replay.
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
body:
  type: json
  content: |-
    {
      "collectedAt": "2026-10-06T10:30:00Z",
      "collectedBy": "courier-17",
      "amount": null
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: pm.variables.set('idempotencyKey', pm.variables.get('fixedIdempotencyKey') || pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 6000
