$kind: http-request
description: Creates a `PENDING_COD` payment. `Idempotency-Key` is mandatory. Re-initiating returns the existing live payment; a different method while one is live → 409.
url: "{{baseUrl}}/billing/payments/initiate"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Idempotency-Key
    value: "{{idempotencyKey}}"
    description: Mandatory/used for money-moving calls. A fresh GUID is generated per send; reuse the same value to test replay.
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
body:
  type: json
  content: |-
    {
      "orderId": "{{orderId}}",
      "method": "COD"
    }
auth:
  type: bearer
  credentials:
    token: "{{buyerToken}}"
scripts:
  - type: beforeRequest
    code: pm.variables.set('idempotencyKey', pm.variables.get('fixedIdempotencyKey') || pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is one of [200, 201]', function () { pm.expect([200, 201]).to.include(pm.response.code); });
      var body; try { body = pm.response.json(); } catch (e) { body = null; }
      if (body && body.data) { var v = (body.data.paymentRef); if (v !== undefined && v !== null) { pm.collectionVariables.set('paymentRef', v); } }
    language: text/javascript
order: 1000
