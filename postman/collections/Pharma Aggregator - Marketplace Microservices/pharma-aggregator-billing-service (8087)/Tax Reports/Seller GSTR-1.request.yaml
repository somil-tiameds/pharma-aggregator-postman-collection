$kind: http-request
description: B2B per invoice, B2C aggregated by place of supply and rate, credit notes, net HSN summary, document ranges.
url: "{{baseUrl}}/billing/seller/reports/gstr1?period=2026-10"
method: GET
headers:
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
queryParams:
  - key: period
    value: 2026-10
    description: YYYY-MM
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 1000
