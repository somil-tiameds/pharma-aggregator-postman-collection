$kind: http-request
url: "{{baseUrl}}/billing/admin/reports/gstr1?sellerId={{sellerId}}&period=2026-10"
method: GET
headers:
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
queryParams:
  - key: sellerId
    value: "{{sellerId}}"
  - key: period
    value: 2026-10
    description: YYYY-MM
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
