$kind: http-request
url: "{{baseUrl}}/billing/refunds?page=0&size=20"
method: GET
headers:
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
queryParams:
  - key: paymentRef
    value: "{{paymentRef}}"
    disabled: true
  - key: orderId
    value: "{{orderId}}"
    disabled: true
  - key: status
    value: REQUESTED
    disabled: true
  - key: page
    value: "0"
  - key: size
    value: "20"
  - key: sort
    value: createdAt,desc
    disabled: true
    description: Whitelisted sort fields only; unknown fields are ignored. size is capped at 100.
auth:
  type: bearer
  credentials:
    token: "{{buyerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
