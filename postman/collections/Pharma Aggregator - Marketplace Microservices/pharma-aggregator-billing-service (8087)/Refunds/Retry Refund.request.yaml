$kind: http-request
description: FAILED → APPROVED, bounded by `billing.refund.max-gateway-retries` (422 beyond).
url: "{{baseUrl}}/billing/refunds/{{refundRef}}/retry"
method: POST
headers:
  - key: Idempotency-Key
    value: "{{idempotencyKey}}"
    description: Mandatory/used for money-moving calls. A fresh GUID is generated per send; reuse the same value to test replay.
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: beforeRequest
    code: pm.variables.set('idempotencyKey', pm.variables.get('fixedIdempotencyKey') || pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: pm.test('Status is one of [200, 422]', function () { pm.expect([200, 422]).to.include(pm.response.code); });
    language: text/javascript
order: 5000
