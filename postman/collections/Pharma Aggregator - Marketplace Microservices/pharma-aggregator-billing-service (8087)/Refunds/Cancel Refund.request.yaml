$kind: http-request
description: Only while REQUESTED/APPROVED.
url: "{{baseUrl}}/billing/refunds/{{refundRef}}/cancel"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
body:
  type: json
  content: |-
    {
      "reason": "Raised in error"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 6000
