$kind: http-request
description: Finance confirms a COD refund was paid, with the bank/cash reference. Online refunds complete through the gateway, never here.
url: "{{baseUrl}}/billing/refunds/{{refundRef}}/confirm"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
body:
  type: json
  content: |-
    {
      "reference": "UTR-1234567890"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 7000
