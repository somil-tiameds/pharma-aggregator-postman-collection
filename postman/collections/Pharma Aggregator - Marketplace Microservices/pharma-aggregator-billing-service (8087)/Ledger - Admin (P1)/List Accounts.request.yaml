$kind: http-request
url: "{{baseUrl}}/billing/admin/ledger/accounts"
method: GET
headers:
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
queryParams:
  - key: ownerType
    value: SELLER
    disabled: true
  - key: ownerId
    value: "{{sellerId}}"
    disabled: true
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 1000
