$kind: http-request
description: Public. Send an OTP to an email that already exists in the system. 200 OtpResponseDTO.
url: "{{baseUrl}}/temp-seller/email-otp/exist/send"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
