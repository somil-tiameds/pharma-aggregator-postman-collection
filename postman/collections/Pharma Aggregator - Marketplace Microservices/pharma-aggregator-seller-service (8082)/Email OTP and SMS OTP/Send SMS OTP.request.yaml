$kind: http-request
description: Public. Send an OTP via Twilio. 200 SMSOtpResponseDTO.
url: "{{baseUrl}}/otp/send"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "{{phone}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 4000
