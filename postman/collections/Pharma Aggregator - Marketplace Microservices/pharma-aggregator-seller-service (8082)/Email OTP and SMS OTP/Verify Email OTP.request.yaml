$kind: http-request
description: Public. Verify the emailed OTP. 200 OtpResponseDTO.
url: "{{baseUrl}}/temp-seller/email-otp/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "otp": "123456"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
