$kind: http-request
description: Registration flow. Returns a bare boolean (true = already exists).
url: "{{baseUrl}}/temp-sellers/coordinator/check-email?email=rahul.sharma@acmepharma.example.com"
method: GET
queryParams:
  - key: email
    value: rahul.sharma@acmepharma.example.com
  - key: tempSellerId
    value: "{{tempSellerId}}"
    disabled: true
    description: Exclude this registration
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 1000
