$kind: http-request
description: Promote a draft to a submitted registration. Full validation applies (same as POST /temp-sellers); 400 with field errors otherwise. 200 TempSellerResponseDTO.
url: "{{baseUrl}}/temp-sellers/draft/{{tempSellerId}}/finalize"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sellerName": "Acme Pharma Distributors",
      "productTypeId": [
        1,
        2
      ],
      "companyTypeId": 1,
      "sellerTypeId": 1,
      "phone": "{{phone}}",
      "email": "{{email}}",
      "termsAccepted": true,
      "companyRegistrationCertificateUrl": "https://s3.example.com/docs/reg-cert.pdf",
      "website": "https://www.acmepharma.example.com",
      "parentManufacturerName": "Sun Pharmaceutical Industries Ltd",
      "brandOwnerName": "Acme Lifesciences Pvt Ltd",
      "gstNumber": "27ABCDE1234F1Z5",
      "gstFileUrl": "https://s3.example.com/docs/gst.pdf",
      "isGstVerified": false,
      "address": {
        "stateId": 1,
        "districtId": 1,
        "talukaId": 1,
        "city": "Mumbai",
        "street": "MG Road",
        "buildingNo": "12-A",
        "landmark": "Near Andheri Station",
        "pinCode": "400001"
      },
      "coordinator": {
        "name": "Rahul Sharma",
        "designation": "Operations Manager",
        "email": "rahul.sharma@acmepharma.example.com",
        "mobile": "9876500000",
        "authorizationLetterUrl": "https://s3.example.com/docs/auth-letter.pdf"
      },
      "bankDetails": {
        "bankName": "HDFC Bank",
        "branch": "Andheri West",
        "ifscCode": "HDFC0000123",
        "stateId": 1,
        "districtId": 1,
        "talukaId": 1,
        "accountNumber": "123456789012",
        "accountHolderName": "Acme Pharma Distributors",
        "bankDocumentFileUrl": "https://s3.example.com/docs/bank-doc.pdf"
      },
      "documents": []
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
