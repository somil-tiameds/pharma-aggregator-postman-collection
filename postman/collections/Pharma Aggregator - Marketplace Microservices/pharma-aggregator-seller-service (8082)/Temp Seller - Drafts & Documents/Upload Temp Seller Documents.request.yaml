$kind: http-request
description: "Multipart upload of registration files; all parts optional. licenseFiles, licenseNames and documentIds are parallel lists (documentIds come from the create/draft response). 200 ApiResponse{data: TempSellerDocumentUploadResponse}."
url: "{{baseUrl}}/temp-sellers/{{tempSellerId}}/documents/upload"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: sellerImage
      src: []
      description: Seller logo/photo
    - type: file
      key: gstFile
      src: []
      description: GST certificate
    - type: file
      key: bankFile
      src: []
      description: Cancelled cheque
    - type: file
      key: companyRegistrationCertificate
      src: []
      description: Company registration certificate
    - type: file
      key: authorizationLetter
      src: []
      description: Coordinator authorization letter
    - type: file
      key: licenseFiles
      src: []
      description: Licence file(s); repeat key for multiple
    - type: text
      key: licenseNames
      value: Drug License
    - type: text
      key: documentIds
      value: "{{documentId}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 4000
