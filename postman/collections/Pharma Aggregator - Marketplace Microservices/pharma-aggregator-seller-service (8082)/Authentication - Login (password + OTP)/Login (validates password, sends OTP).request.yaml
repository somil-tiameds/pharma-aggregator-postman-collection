$kind: http-request
description: Step 1 of login. On success, an OTP is emailed and an OtpSentResponse is returned.
url: "{{baseUrl}}/authentication/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
order: 1000
