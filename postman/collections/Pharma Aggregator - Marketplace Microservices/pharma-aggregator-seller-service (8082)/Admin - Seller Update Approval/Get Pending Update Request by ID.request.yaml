$kind: http-request
description: ADMIN. Fetch one pending seller profile-update request. 200 PendingSellerResponseDTO; 404 if not found.
url: "{{baseUrl}}/admin/seller-requests/pending/{{pendingSellerId}}"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
