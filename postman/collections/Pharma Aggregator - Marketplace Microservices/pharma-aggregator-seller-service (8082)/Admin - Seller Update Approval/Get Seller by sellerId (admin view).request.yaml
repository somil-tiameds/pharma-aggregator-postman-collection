$kind: http-request
description: ADMIN. Fetch live seller profile by string sellerId. 200 SellerProfileResponseDTO; 404 if unknown.
url: "{{baseUrl}}/admin/seller-requests/{{sellerId}}"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 4000
