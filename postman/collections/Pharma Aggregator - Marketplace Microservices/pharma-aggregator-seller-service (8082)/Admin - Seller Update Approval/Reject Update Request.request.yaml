$kind: http-request
description: ADMIN. Reject a pending update request. rejectionReason is required in practice. 200 ApiResponse {status,message,data:null}.
url: "{{baseUrl}}/admin/seller-requests/{{pendingSellerId}}/reject"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "pendingSellerId": "{{pendingSellerId}}",
      "action": "REJECT",
      "rejectionReason": "GST certificate is illegible, please re-upload",
      "approvedBy": "{{approvedBy}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 5000
