$kind: http-request
description: Internal. 200 {email, phone}; 404 if seller not found.
url: "{{baseUrl}}/internal/sellers/{{sellerId}}/contact"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
