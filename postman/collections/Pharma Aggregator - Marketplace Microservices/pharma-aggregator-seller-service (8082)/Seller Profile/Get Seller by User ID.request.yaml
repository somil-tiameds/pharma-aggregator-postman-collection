$kind: http-request
description: "Find the live Seller owned by a user. 200 ApiResponse{data: Seller}."
url: "{{baseUrl}}/sellers/user/{{userId}}"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 4000
