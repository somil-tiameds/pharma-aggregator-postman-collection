$kind: http-request
description: "ADMIN-level destructive: deletes a live seller by sellerId. 200 plain text 'Seller deleted successfully'; 404 if unknown."
url: "{{baseUrl}}/sellers/{{sellerId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 7000
