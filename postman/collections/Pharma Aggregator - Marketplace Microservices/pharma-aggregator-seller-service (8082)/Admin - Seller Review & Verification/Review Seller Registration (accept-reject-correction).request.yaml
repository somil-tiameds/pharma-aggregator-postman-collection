$kind: http-request
name: Review Seller Registration (accept/reject/correction)
description: "ADMIN. Review a temp seller registration. status is ACCEPT, REJECT or CORRECTION; comments required. 200 ApiResponse{data: SellerApprovalResultDTO}; 400 on validation."
url: "{{baseUrl}}/admin/sellers/review"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "{{tempSellerId}}",
      "status": "ACCEPT",
      "comments": "All documents verified"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 5000
