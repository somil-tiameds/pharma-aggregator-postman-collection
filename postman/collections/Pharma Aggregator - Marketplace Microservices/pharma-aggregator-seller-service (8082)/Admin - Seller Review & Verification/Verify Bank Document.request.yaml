$kind: http-request
description: ADMIN. Set bank document verified flag. 200 ApiResponse.
url: "{{baseUrl}}/temp-sellers/{{tempSellerId}}/verify/bank"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isBankDocumentVerified": true
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
