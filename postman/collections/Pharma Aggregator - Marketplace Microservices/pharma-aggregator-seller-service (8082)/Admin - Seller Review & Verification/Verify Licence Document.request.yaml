$kind: http-request
description: ADMIN. Set verified flag on one document. 200 ApiResponse.
url: "{{baseUrl}}/temp-sellers/{{tempSellerId}}/verify/document"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "documentId": "{{documentId}}",
      "isDocumentVerified": true
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
