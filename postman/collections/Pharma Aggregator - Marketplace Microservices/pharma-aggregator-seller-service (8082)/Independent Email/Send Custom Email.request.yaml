$kind: http-request
description: Sends a custom email; params in query. 200 EmailResponseDTO.
url: "{{baseUrl}}/independent/email/send?to={{email}}&subject=Welcome to TiaMeds Marketplace&body=Your registration has been received."
method: POST
queryParams:
  to: "{{email}}"
  subject: Welcome to TiaMeds Marketplace
  body: Your registration has been received.
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
