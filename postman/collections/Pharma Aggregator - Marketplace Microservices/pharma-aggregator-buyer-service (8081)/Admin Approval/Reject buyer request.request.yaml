$kind: http-request
description: "Admin. Rejects the request; comments should state the reason. Body optional. Response: BuyerApprovalResultDTO."
url: "{{baseUrl}}/admin/buyer-requests/{{tempBuyerId}}/reject"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "comments": "Drug licence expired - please upload a valid licence",
      "reviewedBy": "admin@tiameds.ai"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 5000
