$kind: http-request
description: Admin. Admin view of an approved buyer's registration by buyerId (string, e.g. BUY-0001). 404 if missing.
url: "{{baseUrl}}/admin/buyer-requests/{{buyerId}}"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
