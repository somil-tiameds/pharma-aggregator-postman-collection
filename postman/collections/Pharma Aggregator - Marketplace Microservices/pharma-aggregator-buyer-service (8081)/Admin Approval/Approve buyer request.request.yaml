$kind: http-request
description: "Admin. Approves and promotes to a live Buyer. Body optional. Response: {tempBuyerId, buyerId, status, message}; stores buyerId."
url: "{{baseUrl}}/admin/buyer-requests/{{tempBuyerId}}/approve"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "comments": "All documents verified",
      "reviewedBy": "admin@tiameds.ai"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
      var body; try { body = pm.response.json(); } catch (e) { body = null; }
      try { var v = (body.data.buyerId); if (v !== undefined && v !== null) { pm.collectionVariables.set('buyerId', v); } } catch (e) {}
    language: text/javascript
order: 4000
