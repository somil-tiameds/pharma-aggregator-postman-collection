$kind: http-request
name: Verify / unverify document (admin)
description: "Admin action: marks a document verified or not. Query param verified (required boolean)."
url: "{{baseUrl}}/temp-buyers/{{tempBuyerId}}/verify/document/{{documentId}}?verified=true"
method: PATCH
queryParams:
  - key: verified
    value: "true"
    description: true = verified, false = unverified
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 12000
