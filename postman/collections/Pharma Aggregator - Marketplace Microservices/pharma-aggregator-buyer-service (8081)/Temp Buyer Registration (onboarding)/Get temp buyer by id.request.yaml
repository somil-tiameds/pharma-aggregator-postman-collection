$kind: http-request
description: Returns a temp buyer with address, contacts and documents. 404 if missing.
url: "{{baseUrl}}/temp-buyers/{{tempBuyerId}}"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 5000
