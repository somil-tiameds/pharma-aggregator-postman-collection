$kind: http-request
description: "Creates the staging registration for the authenticated buyer user (userId taken from the JWT principal). buyerName is required. Errors: 400 validation. Stores tempBuyerId. Success responses from the UI endpoints are wrapped in the envelope {status, message, data, count}; errors are returned unwrapped. "
url: "{{baseUrl}}/temp-buyers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "buyerName": "Sanjeevani Medical & General Stores",
      "buyerImageUrl": "https://example.com/logos/sanjeevani.png",
      "buyerTypeId": 1,
      "phone": "9822012345",
      "email": "{{email}}",
      "website": "https://www.sanjeevanipharmacy.in",
      "termsAccepted": true,
      "address": {
        "stateId": 27,
        "districtId": 521,
        "talukaId": 3401,
        "city": "Pune",
        "street": "FC Road",
        "buildingNo": "Shop 12, Laxmi Chambers",
        "landmark": "Near Fergusson College",
        "pinCode": "411004"
      },
      "contacts": [
        {
          "name": "Rohan Deshmukh",
          "designation": "Purchase Manager",
          "email": "rohan.deshmukh@sanjeevanipharmacy.in",
          "mobile": "9822012345"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is one of [200, 201]', function () { pm.expect([200, 201]).to.include(pm.response.code); });
      var body; try { body = pm.response.json(); } catch (e) { body = null; }
      try { var v = (body.data.id || body.data.tempBuyerId || body.id); if (v !== undefined && v !== null) { pm.collectionVariables.set('tempBuyerId', v); } } catch (e) {}
    language: text/javascript
order: 1000
