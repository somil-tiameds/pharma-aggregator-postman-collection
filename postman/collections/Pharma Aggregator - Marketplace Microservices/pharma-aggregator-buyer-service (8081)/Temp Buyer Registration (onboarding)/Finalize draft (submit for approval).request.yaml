$kind: http-request
description: "Validates the draft and submits it for admin review. Errors: 400 missing mandatory data, 404."
url: "{{baseUrl}}/temp-buyers/draft/{{tempBuyerId}}/finalize"
method: POST
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 4000
