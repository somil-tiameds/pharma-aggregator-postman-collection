$kind: http-request
description: Returns a buyer profile (BuyerProfileResponseDTO). 404 if unknown.
url: "{{baseUrl}}/buyers/{{buyerId}}"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
