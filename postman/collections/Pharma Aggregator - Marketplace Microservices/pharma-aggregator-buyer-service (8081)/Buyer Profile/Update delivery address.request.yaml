$kind: http-request
description: Updates a saved delivery address. 404 if missing.
url: "{{baseUrl}}/buyers/delivery-addresses/{{deliveryAddressId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "label": "Main Store",
      "stateId": 27,
      "districtId": 521,
      "talukaId": 3401,
      "city": "Pune",
      "street": "FC Road",
      "buildingNo": "Shop 12, Laxmi Chambers",
      "landmark": "Near Fergusson College",
      "pinCode": "411004",
      "contactName": "Rohan Deshmukh",
      "contactPhone": "9822012345",
      "isDefault": true
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 8000
