$kind: http-request
description: Returns the buyer profile linked to a login user id. 404 if none.
url: "{{baseUrl}}/buyers/user/{{userId}}"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
