$kind: http-request
description: Deletes the buyer (destructive; admin use). 404 if missing.
url: "{{baseUrl}}/buyers/{{buyerId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200, 204]', function () { pm.expect([200, 204]).to.include(pm.response.code); });
    language: text/javascript
order: 5000
