$kind: http-request
name: Forgot password (email reset link/token)
description: "Emails password reset instructions/token. Errors: 400 invalid email. Response: {message}."
url: "{{baseUrl}}/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200, 201]', function () { pm.expect([200, 201]).to.include(pm.response.code); });
    language: text/javascript
order: 1000
