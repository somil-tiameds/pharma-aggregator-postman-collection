$kind: http-request
description: "Sets a new password using the emailed token. Errors: 400 invalid token or weak password. Response: {message}."
url: "{{baseUrl}}/auth/reset-password-with-token"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "newPassword": "NewPassw0rd@123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200, 201]', function () { pm.expect([200, 201]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
