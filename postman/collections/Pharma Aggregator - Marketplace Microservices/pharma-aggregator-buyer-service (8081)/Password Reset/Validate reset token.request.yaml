$kind: http-request
description: "Checks that a reset token from the email is valid and unexpired. Errors: 400 invalid/expired token. Response: {message: 'Token is valid'}."
url: "{{baseUrl}}/auth/validate-reset-token"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200, 201]', function () { pm.expect([200, 201]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
