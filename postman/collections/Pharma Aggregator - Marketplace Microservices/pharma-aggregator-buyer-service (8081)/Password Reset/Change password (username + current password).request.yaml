$kind: http-request
description: "Changes password by presenting current credentials (used e.g. when passwordTemporary=true). Errors: 400/401 wrong current password or weak new password. Response: {message}."
url: "{{baseUrl}}/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "currentPassword": "{{password}}",
      "newPassword": "NewPassw0rd@123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200, 201]', function () { pm.expect([200, 201]).to.include(pm.response.code); });
    language: text/javascript
order: 4000
