$kind: http-request
description: "Public. Verifies the emailed signup OTP and creates the buyer user. Errors: 400 invalid/expired OTP. Response: {message, username}."
url: "{{baseUrl}}/auth/signup/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "otp": "123456"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200, 201]', function () { pm.expect([200, 201]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
