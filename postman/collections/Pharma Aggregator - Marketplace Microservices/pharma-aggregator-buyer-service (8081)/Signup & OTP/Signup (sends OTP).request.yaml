$kind: http-request
description: "Public. Validates the signup request and emails a 6-digit OTP. The user is NOT created until verify-otp. Errors: 400 validation (password needs upper/lower/digit/special from @$!%*?&, min 8), 409 if email already registered (ApplicationException status). Response (enveloped): {message, username}."
url: "{{baseUrl}}/auth/signup"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Rohan Deshmukh",
      "email": "{{email}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200, 201]', function () { pm.expect([200, 201]).to.include(pm.response.code); });
    language: text/javascript
order: 1000
