$kind: http-request
description: "Exchanges a refresh token for a new access token (stored in accessToken). Errors: 401 invalid/expired refresh token. Response: LoginResponse."
url: "{{baseUrl}}/authentication/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
      var body; try { body = pm.response.json(); } catch (e) { body = null; }
      var d = body && (body.data || body);
      if (d && d.accessToken) { pm.collectionVariables.set('accessToken', d.accessToken); pm.collectionVariables.set('refreshToken', d.refreshToken); if (d.buyerUserId) pm.collectionVariables.set('userId', d.buyerUserId); }
    language: text/javascript
order: 3000
