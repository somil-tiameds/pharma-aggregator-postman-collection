$kind: http-request
description: "Step 1. Validates credentials and emails an OTP. Errors: 401 invalid credentials, 403 account locked/inactive, 500 generic. Response: {message, username}."
url: "{{baseUrl}}/authentication/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200, 201]', function () { pm.expect([200, 201]).to.include(pm.response.code); });
    language: text/javascript
order: 1000
