$kind: http-request
name: Buyer contact (email/phone)
description: Returns {email, phone} for notification delivery. 404 if unknown.
url: "{{baseUrl}}/internal/buyers/{{buyerId}}/contact"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
