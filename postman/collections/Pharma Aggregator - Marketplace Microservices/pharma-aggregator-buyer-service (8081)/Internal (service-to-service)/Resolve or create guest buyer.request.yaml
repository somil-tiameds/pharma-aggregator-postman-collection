$kind: http-request
description: "Resolves an existing buyer by email or provisions a guest buyer for anonymous quote/order. Response: {buyerId, newlyCreatedOrCredentialsReset}."
url: "{{baseUrl}}/internal/buyers/guest/resolve-or-create"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "guest.buyer@example.com",
      "phone": "9867012345",
      "fullName": "Anita Kulkarni"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 4000
