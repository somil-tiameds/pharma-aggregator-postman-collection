$kind: http-request
description: Returns {buyerId, organizationName, fallbackContactMobile}. 404 if buyer unknown.
url: "{{baseUrl}}/internal/buyers/{{buyerId}}/summary"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 1000
