$kind: http-request
description: Returns {deliveryName, deliveryPhone, deliveryAddressLine, deliveryCity, deliveryDistrict, deliveryState, deliveryPinCode}. 404 if the address does not exist or belongs to another buyer.
url: "{{baseUrl}}/internal/buyers/{{buyerId}}/delivery-addresses/{{deliveryAddressId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
