$kind: http-request
description: Lists configured routes (product-service, buyer-service, order-service, search-service, quotation-service, billing-service, seller-service catch-all) with predicates/filters. Handy to verify route order and StripPrefix=2. May be 404 if the MVC gateway variant does not expose it.
url: "{{baseUrl}}/actuator/gateway/routes"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200, 404]', function () { pm.expect([200, 404]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
