$kind: http-request
description: Route buyer-service -> /authentication/login. Public. Validates credentials and sends an OTP (finish with verify-otp, which returns accessToken). 401 bad credentials, 403 locked/inactive.
url: "{{baseUrl}}/api/v1/authentication/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "buyer@example.com",
      "password": "Password@123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200, 401, 403]', function () { pm.expect([200, 401, 403]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
