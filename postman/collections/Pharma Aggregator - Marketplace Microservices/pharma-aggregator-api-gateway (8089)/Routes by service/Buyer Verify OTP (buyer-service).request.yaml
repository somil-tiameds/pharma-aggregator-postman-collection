$kind: http-request
description: Route buyer-service. Public. Completes login and stores the buyer JWT in buyerToken (used by the buyer-secret routes).
url: "{{baseUrl}}/api/v1/authentication/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "buyer@example.com",
      "otp": "123456"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
      var body; try { body = pm.response.json(); } catch (e) { body = null; }
      try { var v = (body.accessToken || (body.data && body.data.accessToken)); if (v !== undefined && v !== null) { pm.collectionVariables.set('buyerToken', v); } } catch (e) {}
    language: text/javascript
order: 3000
