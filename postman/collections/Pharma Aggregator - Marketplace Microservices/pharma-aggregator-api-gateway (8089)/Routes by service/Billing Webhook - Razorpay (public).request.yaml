$kind: http-request
description: Public route (no JWT; authenticated by HMAC signature in billing-service). 200 {status} when accepted/already held; 401 on bad signature. Use a real HMAC of the exact body, otherwise expect 401.
url: "{{baseUrl}}/api/v1/billing/webhooks/razorpay"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: X-Razorpay-Signature
    value: "{{razorpaySignature}}"
    description: HMAC-SHA256 of the raw body with the webhook secret
  - key: X-Razorpay-Event-Id
    value: evt_test_001
body:
  type: json
  content: |-
    {
      "event": "payment.captured",
      "payload": {}
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200, 401]', function () { pm.expect([200, 401]).to.include(pm.response.code); });
    language: text/javascript
order: 10000
