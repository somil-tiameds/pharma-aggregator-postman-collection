$kind: collection
description: |-
  Master collection for the pharma-aggregator-marketplace-micro monorepo. One top-level folder per service/module; each folder carries its own `baseUrl` folder variable (the service's real default port) so it can be run standalone or repointed at the API Gateway (8089, prefix `/api/v1`, StripPrefix=2).

  Every HTTP endpoint of every service is covered. Requests capture ids into collection variables so flows can be run top to bottom; fill the token variables (`accessToken` / `buyerToken` / `sellerToken` / `adminToken`) and the shared `serviceToken` (BILLING_SERVICE_TOKEN) in the relevant folder variables first. The Git-synced v3 copy under postman/ may be ahead or behind this file - re-export when request sets change.

  Import this file classically (File > Import) for normal request-builder testing.
