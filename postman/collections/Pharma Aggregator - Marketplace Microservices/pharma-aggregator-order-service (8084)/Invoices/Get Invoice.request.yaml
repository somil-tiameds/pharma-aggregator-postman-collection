$kind: http-request
description: "Fetches invoice metadata by numeric invoiceId. Caller: seller or buyer (use buyerToken if needed). Errors: 404. Returns 200 ApiResponse<InvoiceResponseDTO>. Via the gateway the path is /api/v1<path> (StripPrefix=2); this collection calls the service directly on 8084 (no context path)."
url: "{{baseUrl}}/invoices/{{orderInvoiceId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
