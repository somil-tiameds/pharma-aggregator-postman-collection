$kind: http-request
description: "Seller approves or rejects a return. Caller: the item's seller (sellerId in body). Precondition: return in REQUESTED. approve=true creates a refund record (refundId in response). Errors: 400 validation, 401/403 not the item's seller, 404, 409 already decided. Returns 200 ApiResponse<ReturnResponseDTO>. Via the gateway the path is /api/v1<path> (StripPrefix=2); this collection calls the service directly on 8084 (no context path)."
url: "{{baseUrl}}/returns/{{returnId}}/decision"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sellerId": "{{sellerId}}",
      "approve": true,
      "comment": "Approved - pickup will be arranged"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
      var body; try { body = pm.response.json(); } catch (e) { body = null; }
      try { var v = (body.data.refundId); if (v !== undefined && v !== null) { pm.collectionVariables.set('refundId', v); } } catch (e) {}
    language: text/javascript
order: 2000
