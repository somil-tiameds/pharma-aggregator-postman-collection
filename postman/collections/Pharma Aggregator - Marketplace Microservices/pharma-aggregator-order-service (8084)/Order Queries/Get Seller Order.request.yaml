$kind: http-request
description: "Fetches one seller order (items, tracking, statusHistory). Caller: the owning seller; identity comes from the JWT sellerId claim. Errors: 401 no/invalid token or the seller order belongs to another seller, 404 not found. Returns 200 ApiResponse<SellerOrderResponseDTO>. Via the gateway the path is /api/v1<path> (StripPrefix=2); this collection calls the service directly on 8084 (no context path)."
url: "{{baseUrl}}/seller-orders/{{sellerOrderId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
