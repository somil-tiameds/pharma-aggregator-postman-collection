$kind: http-request
description: "Paged list of the authenticated seller's orders, optionally filtered by status. NOTE: the {sellerId} path segment is ignored; the JWT sellerId is used. status e.g. PLACED, CONFIRMED, PACKED, SHIPPED, OUT_FOR_DELIVERY, DELIVERED, CANCELLED. Returns 200 ApiResponse<Page<SellerOrderResponseDTO>>. Via the gateway the path is /api/v1<path> (StripPrefix=2); this collection calls the service directly on 8084 (no context path)."
url: "{{baseUrl}}/seller-orders/seller/{{sellerId}}?page=0&size=20"
method: GET
queryParams:
  - key: status
    value: PLACED
    disabled: true
    description: Optional status filter
  - key: page
    value: "0"
    description: Zero-based page index
  - key: size
    value: "20"
    description: Page size
  - key: sort
    value: createdAt,desc
    disabled: true
    description: Sort, e.g. createdAt,desc
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 4000
