$kind: http-request
description: "Fetches one order with its sellerOrders, items and status history. Caller: buyer (no ownership check is enforced by the service). Errors: 404 order not found. Returns 200 ApiResponse<OrderResponseDTO>. Via the gateway the path is /api/v1<path> (StripPrefix=2); this collection calls the service directly on 8084 (no context path)."
url: "{{baseUrl}}/orders/{{orderId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{buyerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
      var body; try { body = pm.response.json(); } catch (e) { body = null; }
      try { var v = (body.data.sellerOrders[0].sellerOrderId); if (v !== undefined && v !== null) { pm.collectionVariables.set('sellerOrderId', v); } } catch (e) {}
    language: text/javascript
order: 1000
