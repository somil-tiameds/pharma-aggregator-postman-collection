$kind: http-request
description: "Seller cancels their seller order (role SELLER and actorId=JWT sellerId are applied server-side; body actorRole/actorId are still required by validation). Allowed only before DELIVERED; stock is restocked. Errors: 400 validation/illegal state, 401, 404. Returns 200 ApiResponse<SellerOrderResponseDTO>. Via the gateway the path is /api/v1<path> (StripPrefix=2); this collection calls the service directly on 8084 (no context path)."
url: "{{baseUrl}}/seller-orders/{{sellerOrderId}}/cancel"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "actorRole": "SELLER",
      "actorId": "{{sellerId}}",
      "reason": "Out of stock at warehouse"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 7000
