$kind: http-request
description: "Only from SHIPPED. Triggers a delivery OTP to the buyer (see Resend Delivery OTP). Caller: owning seller (JWT sellerId claim is authoritative; the body sellerId is required by validation but not trusted). Errors: 400 validation, 401 not your seller order, 404 not found, 400/409 illegal state transition. Returns 200 ApiResponse<SellerOrderResponseDTO>. Via the gateway the path is /api/v1<path> (StripPrefix=2); this collection calls the service directly on 8084 (no context path)."
url: "{{baseUrl}}/seller-orders/{{sellerOrderId}}/out-for-delivery"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sellerId": "{{sellerId}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 4000
