$kind: http-request
description: "Resolves one batch with its product/seller/packaging context: {pricingId, productId, productName, sellerId, packagingId, minimumOrderQuantity, maximumOrderQuantity, batchLotNumber, sellingPrice, discountPercentage, gstPercentage}. 404 'Batch not found' if unknown."
url: "{{baseUrl}}/internal/pricing/{{productServicePricingId}}/lookup"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
