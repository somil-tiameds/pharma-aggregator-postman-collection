$kind: http-request
description: "Resolves a product snapshot: {productId, productName, sellerId}. 404 if unknown."
url: "{{baseUrl}}/internal/products/{{productServiceProductId}}/lookup"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 1000
