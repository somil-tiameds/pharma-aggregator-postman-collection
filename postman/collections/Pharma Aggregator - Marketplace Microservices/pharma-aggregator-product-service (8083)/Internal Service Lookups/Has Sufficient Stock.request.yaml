$kind: http-request
description: Non-locking availability check. Returns a bare boolean (true when available quantity >= quantity).
url: "{{baseUrl}}/internal/stock/has-sufficient?productId={{productServiceProductId}}&quantity=10"
method: GET
queryParams:
  - key: productId
    value: "{{productServiceProductId}}"
    description: Required
  - key: packagingId
    value: "{{productServicePackagingId}}"
    disabled: true
    description: Optional packaging filter
  - key: quantity
    value: "10"
    description: Required quantity to check
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 4000
