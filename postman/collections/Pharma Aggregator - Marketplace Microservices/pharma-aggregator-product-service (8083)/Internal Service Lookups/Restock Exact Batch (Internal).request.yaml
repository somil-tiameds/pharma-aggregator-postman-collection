$kind: http-request
description: Restocks quantity back into the exact batch previously debited (cancellation/return path). 200 with empty body; 404 'Batch not found' if pricingId is unknown.
url: "{{baseUrl}}/internal/stock/restock"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "pricingId": "{{productServicePricingId}}",
      "quantity": 10,
      "sellerOrderId": "SORD-2026-0001",
      "referenceType": "ORDER_CANCELLED"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 6000
