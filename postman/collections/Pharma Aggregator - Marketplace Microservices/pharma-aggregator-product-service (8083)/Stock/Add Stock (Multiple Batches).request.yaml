$kind: http-request
description: Stock-in for several batches of one product in one call. Each element of `batches` has the same fields as the single-batch request (minus productId). Returns an array of StockLedgerResponseDto, one per batch.
url: "{{baseUrl}}/stock/add-batches?sellerId={{productServiceSellerId}}"
method: POST
headers:
  Content-Type: application/json
queryParams:
  - key: sellerId
    value: "{{productServiceSellerId}}"
    description: Seller performing the stock-in
