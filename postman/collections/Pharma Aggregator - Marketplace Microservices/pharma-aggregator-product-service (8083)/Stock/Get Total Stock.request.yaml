$kind: http-request
description: Current total available quantity for the product across batches. Body is a bare number (Long).
url: "{{baseUrl}}/stock/{{productServiceProductId}}/total"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 4000
