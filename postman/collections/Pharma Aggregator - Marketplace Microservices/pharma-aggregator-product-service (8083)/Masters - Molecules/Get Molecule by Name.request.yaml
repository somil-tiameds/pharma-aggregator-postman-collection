$kind: http-request
description: Exact lookup of a molecule by name, e.g. Paracetamol. 404 if unknown.
url: "{{baseUrl}}/molecules/byName?name=Paracetamol"
method: GET
queryParams:
  - key: name
    value: Paracetamol
    description: Required. Molecule name
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
