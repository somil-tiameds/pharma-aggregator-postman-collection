$kind: http-request
description: "All molecule (salt/generic) masters: [{moleculeId, moleculeName, mechanismOfAction, primaryUse, drugSchedule, therapeuticSubcategoryId}]. Returns a plain JSON array (not wrapped in ApiResponse). Public, no auth."
url: "{{baseUrl}}/molecules/getAllMolecules"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 1000
