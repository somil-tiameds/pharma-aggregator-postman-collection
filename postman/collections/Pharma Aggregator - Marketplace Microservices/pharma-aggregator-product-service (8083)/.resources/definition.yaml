$kind: collection
description: "Product catalogue domain (port 8083, no context path): products and per-category attributes (drugs, consumables, supplements, cosmetics, food/infant, non-consumables, medical devices), pricing/batches, stock, images/documents, Excel/CSV import, and all master/reference data (dosage forms, pack types, molecules, GST slabs, device categories, certifications ...). This service has no JWT stack: endpoints are public (auth = none) and callers are expected to be behind the api-gateway. Internal lookups used by other services live under the 'Internal' sub-folder. Errors: ResourceNotFoundException -> 404 and BadRequestException/validation -> 400 as ApiResponse {status:'ERROR', message, data}; BaseException -> ErrorResponse {status, message}. Master-data lists generally return plain JSON arrays. Folder variables (categoryId, dosageId, packTypeId, moleculeId, ...) are user-filled defaults; ids captured from responses (productCategoryId, flavourId) are stored as collection variables."
order: 6000
