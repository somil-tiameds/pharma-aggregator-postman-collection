$kind: http-request
description: Uploads one or more product images (multipart, repeat the `images` part) and links them to the product. Returns a JSON array of image URLs (List<String>). 404 if the product does not exist.
url: "{{baseUrl}}/product-images/{{productServiceProductId}}"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: images
      src: []
      description: One or more image files (jpg/png)
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 1000
