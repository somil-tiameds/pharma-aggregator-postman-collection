$kind: http-request
description: "Pack type unit master (e.g. Tablets, ml, Strips). Response is wrapped: ApiResponse {status:'200 OK', message, data:[...], count}."
url: "{{baseUrl}}/pack-type-units"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 6000
