$kind: http-request
description: Strength-format rules for the molecules of a dosage form (how strength is entered, e.g. '500 mg' per tablet). Returns a plain JSON array (not wrapped in ApiResponse). Public, no auth.
url: "{{baseUrl}}/dosageMolecule/strengthFormat/{{dosageId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 7000
