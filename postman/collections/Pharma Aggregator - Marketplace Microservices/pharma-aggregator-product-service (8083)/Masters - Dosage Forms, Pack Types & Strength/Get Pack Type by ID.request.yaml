$kind: http-request
description: Returns one PackTypeDto. Unknown id -> error from GlobalExceptionHandler (404 for ResourceNotFoundException).
url: "{{baseUrl}}/packType/packTypeById/{{packTypeId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 5000
