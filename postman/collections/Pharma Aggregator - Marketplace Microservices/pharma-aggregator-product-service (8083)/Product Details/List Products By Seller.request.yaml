$kind: http-request
description: All products owned by the given sellerId. Empty array if none.
url: "{{baseUrl}}/products/seller/{{productServiceSellerId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
