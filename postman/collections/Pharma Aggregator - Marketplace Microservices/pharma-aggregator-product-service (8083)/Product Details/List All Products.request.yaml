$kind: http-request
description: Returns every product (unpaginated) as a JSON array of ProductDetailsDto.
url: "{{baseUrl}}/products/all"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
