$kind: http-request
description: Single ProductDetailsDto including attribute sets and image URLs. 404 if the productId does not exist.
url: "{{baseUrl}}/products/getById/{{productServiceProductId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 4000
