$kind: http-request
description: Lists all product categories (categoryId, categoryName, categoryDescription). Returns a plain JSON array (not wrapped in ApiResponse). Public, no auth.
url: "{{baseUrl}}/categories"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
