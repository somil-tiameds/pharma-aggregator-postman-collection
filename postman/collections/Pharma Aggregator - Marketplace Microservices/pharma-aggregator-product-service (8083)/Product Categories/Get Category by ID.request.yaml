$kind: http-request
description: "Fetches one category. 404 (ApiResponse status=ERROR, message 'Category not found: <id>') if missing."
url: "{{baseUrl}}/categories/{{productCategoryId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
