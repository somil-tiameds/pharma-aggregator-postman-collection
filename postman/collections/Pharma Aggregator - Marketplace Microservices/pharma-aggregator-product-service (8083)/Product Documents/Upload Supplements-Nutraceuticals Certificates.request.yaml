$kind: http-request
name: Upload Supplements/Nutraceuticals Certificates
description: "Uploads certification documents for a Supplements/Nutraceuticals product attribute (multipart). `certificateFiles` and `documentIds` are positional: documentIds[i] is the certification id of certificateFiles[i] (repeat the documentIds key per file). Returns ApiResponse<CertificateUploadResponse> {productAttributeId, attributeType, uploadedCertificates[{productCertificateDocumentId, certificationId, certificationName, certificateUrl}], brochureUrl}. 404 if the attribute id is unknown."
url: "{{baseUrl}}/product-documents/supplements/{{productServiceAttributeId}}/certificates"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: certificateFiles
      src: []
      description: One or more PDF/image certificate files
    - type: text
      key: documentIds
      value: "1"
      description: "Certification id for file #1"
    - type: text
      key: documentIds
      value: "2"
      description: "Certification id for file #2 (remove if uploading one file)"
    - type: text
      key: uploadedBy
      value: "{{productServiceSellerId}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 5000
