$kind: http-request
description: Uploads certification documents for a Food & Infant product attribute (multipart; documentIds[i] pairs with certificateFiles[i]). Returns ApiResponse<CertificateUploadResponse>. There is no food brochure endpoint (use User Manual > Upload Food/Infant Manual).
url: "{{baseUrl}}/product-documents/food/{{productServiceAttributeId}}/certificates"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: certificateFiles
      src: []
      description: One or more certificate files
    - type: text
      key: documentIds
      value: "1"
      description: "Certification id for file #1"
    - type: text
      key: uploadedBy
      value: "{{productServiceSellerId}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 9000
