$kind: http-request
description: "Allowed GST slabs (0, 5, 12, 18, 28 %). Wrapped: ApiResponse {status, message, data:[...], count}."
url: "{{baseUrl}}/gst-percentages"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
