$kind: http-request
description: "One flavour. 404 'Flavour not found: <id>' if missing."
url: "{{baseUrl}}/flavours/{{flavourId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 7000
