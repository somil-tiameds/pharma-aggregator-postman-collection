$kind: http-request
description: Deletes a flavour by id. Returns 200 with empty body.
url: "{{baseUrl}}/flavours/{{flavourId}}"
method: DELETE
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 10000
