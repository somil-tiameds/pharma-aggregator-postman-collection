$kind: http-request
description: Renames a flavour and optionally toggles isActive (unchanged when null). 404 if id unknown.
url: "{{baseUrl}}/flavours/{{flavourId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "flavourName": "Mixed Fruit",
      "isActive": true
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 9000
