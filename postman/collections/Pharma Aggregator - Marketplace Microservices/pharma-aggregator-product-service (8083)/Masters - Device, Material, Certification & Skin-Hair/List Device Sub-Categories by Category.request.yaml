$kind: http-request
description: Device sub-categories under one device category id. Returns a plain JSON array (not wrapped in ApiResponse). Public, no auth.
url: "{{baseUrl}}/masters/device-sub-categories/{{deviceCategoryId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 9000
