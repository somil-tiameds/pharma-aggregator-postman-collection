$kind: http-request
description: Storage condition master (e.g. 'Store below 25C', 'Refrigerate 2-8C'). Returns a plain JSON array (not wrapped in ApiResponse). Public, no auth.
url: "{{baseUrl}}/masters/storagecondition"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
