$kind: http-request
description: Country of origin / manufacture master. Returns a plain JSON array (not wrapped in ApiResponse). Public, no auth.
url: "{{baseUrl}}/masters/countries"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 1000
