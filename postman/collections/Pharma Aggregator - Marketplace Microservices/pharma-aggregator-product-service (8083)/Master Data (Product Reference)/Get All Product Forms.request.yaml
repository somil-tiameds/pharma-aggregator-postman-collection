$kind: http-request
description: All product forms (e.g. cream, powder, liquid). Bare array of ProductFormMasterDto.
url: "{{baseUrl}}/productForm/getAll"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
