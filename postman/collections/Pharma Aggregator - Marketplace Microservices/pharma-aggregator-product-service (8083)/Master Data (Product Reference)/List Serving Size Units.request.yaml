$kind: http-request
description: All serving size units (e.g. g, ml, scoop).
url: "{{baseUrl}}/serving-size"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 4000
