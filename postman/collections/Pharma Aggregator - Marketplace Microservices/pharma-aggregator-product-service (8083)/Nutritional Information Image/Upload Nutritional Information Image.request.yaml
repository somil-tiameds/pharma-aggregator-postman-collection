$kind: http-request
description: "Uploads a nutritional-information label image (multipart/form-data) for a supplement/food product attribute and stores it in object storage. Parts: categoryId (Long, required) and images (single file, required - the part name is 'images'). Response: {message:'Image uploaded successfully', imageUrl}."
url: "{{baseUrl}}/nutritionalInformationImage/{{productAttributeId}}"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: categoryId
      value: "{{categoryId}}"
      description: Product category id (e.g. supplements / food-infant)
    - type: file
      key: images
      src: []
      description: Image file (jpg/png) of the nutrition label
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 1000
