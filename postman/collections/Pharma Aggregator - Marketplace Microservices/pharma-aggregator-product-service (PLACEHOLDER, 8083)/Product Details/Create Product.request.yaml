$kind: http-request
description: Creates a new product for a seller under a given category. Phase 1 core catalog fields only — packaging/pricing sub-resources are deferred.
url: "{{baseUrl}}/products/create"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "productName": "Paracetamol 500mg Tablet",
      "warningsPrecautions": "Do not exceed recommended dosage.",
      "productDescription": "Pain relief and fever reducer tablet strip.",
      "manufacturerName": "Cipla Ltd",
      "createdBy": "{{sellerId}}",
      "categoryId": 1,
      "sellerId": "{{sellerId}}",
      "gstPercentage": 12,
      "hsnCode": 30049099,
      "status": "ACTIVE"
    }
order: 1000
