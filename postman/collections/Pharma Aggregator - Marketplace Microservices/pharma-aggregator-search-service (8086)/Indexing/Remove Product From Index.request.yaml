$kind: http-request
description: 'DELETE /search/index/{productId} — removes a document from the products index (e.g. when product-service hard-deletes or unpublishes a product outside of a status-change payload).'
url: '{{baseUrl}}/search/index/{{productId}}'
method: DELETE
order: 3100
headers:
  - key: X-Internal-Api-Key
    value: '{{internalApiKey}}'
    disabled: true
    description: Required once app.internal.api-key is configured (search-service-security.md) — enable and set internalApiKey to test the locked-down path.
pathVariables:
  - key: productId
    value: '{{productId}}'
examples: './.resources/Remove Product From Index.resources/examples'
