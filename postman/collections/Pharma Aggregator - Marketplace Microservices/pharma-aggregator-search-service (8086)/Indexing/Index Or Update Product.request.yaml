$kind: http-request
description: 'POST /search/index/{productId} — upserts a SearchProductDocument. If status is anything other than PUBLISHED, ProductIndexService deletes the document instead of indexing it (ReindexController delegates to ProductIndexService.indexOrRemove).'
url: '{{baseUrl}}/search/index/{{productId}}'
method: POST
order: 3000
headers:
  - key: Content-Type
    value: application/json
  - key: X-Internal-Api-Key
    value: '{{internalApiKey}}'
    disabled: true
    description: Required once app.internal.api-key is configured (search-service-security.md) — enable and set internalApiKey to test the locked-down path.
pathVariables:
  - key: productId
    value: '{{productId}}'
body:
  type: json
  content: |-
    {
      "productName": "Paracetamol 500mg Tablet",
      "manufacturerName": "Acme Pharma",
      "productDescription": "Pain relief and fever reducer, strip of 10 tablets",
      "categoryId": "{{categoryId}}",
      "categoryName": "Drugs",
      "sellerId": "{{sellerId}}",
      "sellerApproved": true,
      "therapeuticCategory": "Analgesic",
      "dosageForm": "Tablet",
      "packType": "Strip",
      "priceMin": 12.5,
      "priceMax": 15.0,
      "gstPercentage": 12.0,
      "hsnCode": 30049099,
      "status": "PUBLISHED",
      "stockAvailable": true,
      "attributeTags": ["fever", "pain-relief", "otc"]
    }
examples: './.resources/Index Or Update Product.resources/examples'
