$kind: http-example
name: 200 OK
request:
  url: '{{baseUrl}}/search/index/reconcile'
  method: POST
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "SUCCESS",
        "message": "Reconciliation triggered",
        "data": {
          "upsertedCount": 0,
          "deletedCount": 0,
          "failedCount": 0
        }
      }
