$kind: http-example
name: 400 Bad Request (q too short)
request:
  url: '{{baseUrl}}/search/autocomplete?q=p'
  method: GET
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": 400,
        "message": "q must be at least 2 characters"
      }
