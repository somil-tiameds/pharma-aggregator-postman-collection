$kind: http-example
name: 200 OK
request:
  url: '{{baseUrl}}/search/autocomplete?q=para&limit=10'
  method: GET
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "SUCCESS",
        "message": "Autocomplete suggestions",
        "data": [
          { "text": "Paracetamol 500mg Tablet", "productId": "1001", "categoryName": "Drugs" },
          { "text": "Paracetamol Syrup 60ml", "productId": "1002", "categoryName": "Drugs" }
        ]
      }
