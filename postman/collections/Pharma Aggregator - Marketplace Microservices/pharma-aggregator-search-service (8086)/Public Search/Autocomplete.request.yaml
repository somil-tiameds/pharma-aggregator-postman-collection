$kind: http-request
description: "Type-ahead suggestions (suggestion, productId, categoryName). Auth: none. Errors: 400 if q is shorter than 2 characters."
url: "{{baseUrl}}/search/autocomplete?q=para&limit=10"
method: GET
queryParams:
  - key: q
    value: para
    description: Prefix, minimum 2 characters (required)
  - key: limit
    value: "10"
    description: Max suggestions (default 10)
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 4000
