$kind: http-request
description: "Internal service-to-service endpoint, protected by InternalApiKeyFilter. Auth: header X-Internal-Api-Key must equal app.internal.api-key; 401 if missing/invalid or if the key is not configured (fails closed). Runs the product-service -> index reconciliation job on demand. Response data: upsertedCount, deletedCount, failedCount."
url: "{{baseUrl}}/search/index/reconcile"
method: POST
headers:
  - key: X-Internal-Api-Key
    value: "{{internalApiKey}}"
    description: Shared secret = app.internal.api-key of search-service
queryParams:
  - key: sinceTimestamp
    value: 2026-01-01T00:00:00Z
    disabled: true
    description: ISO-8601 instant; only reconcile changes since then (omit for default window)
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
