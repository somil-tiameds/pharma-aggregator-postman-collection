$kind: http-example
name: 200 OK
request:
  url: '{{baseUrl}}/search/trending?limit=10'
  method: GET
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "SUCCESS",
        "message": "Trending search terms",
        "data": [
          { "term": "paracetamol", "searchCount": 214, "rank": 1 },
          { "term": "vitamin c", "searchCount": 178, "rank": 2 }
        ]
      }
