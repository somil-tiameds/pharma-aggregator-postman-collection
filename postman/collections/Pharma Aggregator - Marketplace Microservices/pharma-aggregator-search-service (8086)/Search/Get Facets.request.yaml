$kind: http-request
description: 'GET /search/facets — same query/filter parameters as Search Products, but returns only facet aggregation counts (categoryName, therapeuticCategory, dosageForm, packType), size=0. Useful for rendering the filter sidebar before/without fetching results.'
url: '{{baseUrl}}/search/facets?q={{searchQuery}}&categoryId={{categoryId}}&therapeuticCategory={{therapeuticCategory}}&dosageForm={{dosageForm}}&packType={{packType}}&priceMin={{priceMin}}&priceMax={{priceMax}}&inStockOnly={{inStockOnly}}&sellerId={{sellerId}}'
method: GET
order: 1100
queryParams:
  - key: q
    value: '{{searchQuery}}'
    description: Free-text search term (required)
  - key: categoryId
    value: '{{categoryId}}'
    disabled: true
  - key: therapeuticCategory
    value: '{{therapeuticCategory}}'
    disabled: true
  - key: dosageForm
    value: '{{dosageForm}}'
    disabled: true
  - key: packType
    value: '{{packType}}'
    disabled: true
  - key: priceMin
    value: '{{priceMin}}'
    disabled: true
  - key: priceMax
    value: '{{priceMax}}'
    disabled: true
  - key: inStockOnly
    value: '{{inStockOnly}}'
    disabled: true
  - key: sellerId
    value: '{{sellerId}}'
    disabled: true
