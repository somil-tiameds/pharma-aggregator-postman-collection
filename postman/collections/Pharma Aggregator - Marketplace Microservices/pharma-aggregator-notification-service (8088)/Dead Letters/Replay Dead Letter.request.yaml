$kind: http-request
description: 400 if the recipient's contact can no longer be resolved.
url: "{{baseUrl}}/admin/notifications/dlq/{{dlqId}}/replay"
method: POST
headers:
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
queryParams:
  - key: adminId
    value: "{{adminId}}"
    disabled: true
    description: Recorded for the audit trail.
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200, 400]', function () { pm.expect([200, 400]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
