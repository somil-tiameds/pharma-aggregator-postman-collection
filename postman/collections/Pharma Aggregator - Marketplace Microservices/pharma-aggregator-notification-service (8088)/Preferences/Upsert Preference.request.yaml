$kind: http-request
description: "`recipientType`: BUYER | SELLER | ADMIN. Unique per (recipient, eventType, channel)."
url: "{{baseUrl}}/notification-preferences/{{recipientId}}"
method: PUT
headers:
  - key: Content-Type
    value: application/json
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
body:
  type: json
  content: |-
    {
      "recipientType": "BUYER",
      "eventType": "PaymentCaptured",
      "channel": "EMAIL",
      "enabled": false
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 2000
