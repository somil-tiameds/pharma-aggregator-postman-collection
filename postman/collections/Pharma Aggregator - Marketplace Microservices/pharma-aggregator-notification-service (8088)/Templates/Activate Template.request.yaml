$kind: http-request
description: Activates this version and deactivates the one previously active for the same (eventType, channel, locale).
url: "{{baseUrl}}/admin/notifications/templates/{{templateId}}/activate"
method: PATCH
headers:
  - key: X-Correlation-Id
    value: "{{$guid}}"
    disabled: true
    description: Optional; echoed on the response and in service logs.
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 3000
