$kind: http-request
description: Sends a one-time verification code to the given email address during seller registration (for a new/unused email).
url: "{{baseUrl}}/temp-seller/email-otp/send"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "rahul.sharma@sunrisepharma.example.com"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 1000
