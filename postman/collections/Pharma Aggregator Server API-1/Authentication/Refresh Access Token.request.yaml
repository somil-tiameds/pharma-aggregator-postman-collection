$kind: http-request
description: Exchanges a valid refresh token for a new access token (and rotated refresh token). Automatically updates 'access_token' and 'refresh_token' collection variables. Public endpoint.
url: "{{baseUrl}}/authentication/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refresh_token}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });

      pm.test('New access token received', function () {
          var jsonData = pm.response.json();
          if (jsonData.accessToken) {
              pm.collectionVariables.set('access_token', jsonData.accessToken);
          }
          if (jsonData.refreshToken) {
              pm.collectionVariables.set('refresh_token', jsonData.refreshToken);
          }
      });
    language: text/javascript
settings: {}
order: 3000
