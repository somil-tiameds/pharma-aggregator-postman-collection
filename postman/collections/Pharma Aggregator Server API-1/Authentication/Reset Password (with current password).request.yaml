$kind: http-request
description: Resets a user's password by validating their current password first. Requires username, currentPassword, and a newPassword meeting complexity rules (min 8 chars, 1 digit, 1 lowercase, 1 uppercase, 1 special character, no whitespace).
url: "{{baseUrl}}/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "seller_admin",
      "currentPassword": "OldP@ssw0rd1",
      "newPassword": "NewP@ssw0rd1"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 5000
