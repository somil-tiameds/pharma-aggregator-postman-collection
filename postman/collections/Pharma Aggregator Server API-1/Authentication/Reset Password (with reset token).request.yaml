$kind: http-request
description: Sets a new password using the reset token obtained from the forgot-password / verify-otp flow (instead of the current password). New password must meet complexity rules.
url: "{{baseUrl}}/auth/reset-password-with-token"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{reset_token}}",
      "newPassword": "NewP@ssw0rd1"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 9000
