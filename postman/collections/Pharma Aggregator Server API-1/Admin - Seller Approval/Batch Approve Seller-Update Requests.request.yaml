$kind: http-request
description: Approves multiple pending seller profile-update requests at once, given a list of pendingSellerIds.
url: "{{baseUrl}}/admin/seller-requests/batch-approve?approvedBy=admin_user"
method: POST
headers:
  Content-Type: application/json
queryParams:
  approvedBy: admin_user
body:
  type: json
  content: |-
    [
      1,
      2,
      3
    ]
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 7000
