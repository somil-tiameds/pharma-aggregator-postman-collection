$kind: http-request
description: Approves a pending seller profile-update request; pending data is merged into the main seller tables.
url: "{{baseUrl}}/admin/seller-requests/{{pendingSellerId}}/approve?approvedBy=admin_user"
method: POST
queryParams:
  approvedBy: admin_user
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 5000
