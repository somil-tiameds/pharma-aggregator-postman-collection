$kind: http-request
description: Sends the application-confirmation email using only the minimal required parameters (coordinator email/name, application ID, seller name).
url: "{{baseUrl}}/independent/email/send-quick?coordinatorEmail=rahul.sharma@sunrisepharma.example.com&coordinatorName=Rahul Sharma&applicationRequestId=APP-2026-000123&sellerName=Sunrise Pharma Distributors"
method: POST
queryParams:
  coordinatorEmail: rahul.sharma@sunrisepharma.example.com
  coordinatorName: Rahul Sharma
  applicationRequestId: APP-2026-000123
  sellerName: Sunrise Pharma Distributors
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 4000
