$kind: http-request
description: Sends a free-form custom email to any recipient with the given subject and body text.
url: "{{baseUrl}}/independent/email/send?to=recipient@example.com&subject=Update on your application&body=Your seller application is under review."
method: POST
queryParams:
  to: recipient@example.com
  subject: Update on your application
  body: Your seller application is under review.
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 2000
