$kind: http-request
description: Deletes only the temporary seller record (used e.g. to discard a rejected/abandoned registration).
url: "{{baseUrl}}/temp-sellers/{{tempSellerId}}"
method: DELETE
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 8000
