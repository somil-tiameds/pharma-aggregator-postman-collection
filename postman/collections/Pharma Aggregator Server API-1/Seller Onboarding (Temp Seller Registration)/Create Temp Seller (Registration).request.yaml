$kind: http-request
description: STEP 1 of seller self-registration. Submits seller company, address, coordinator, bank, and license document metadata for review. Returns a tempSellerId used for subsequent document upload and admin review. Public endpoint.
url: "{{baseUrl}}/temp-sellers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sellerName": "Sunrise Pharma Distributors",
      "productTypeId": [
        1,
        2
      ],
      "companyTypeId": 1,
      "sellerTypeId": 2,
      "phone": "9876543210",
      "email": "contact@sunrisepharma.example.com",
      "termsAccepted": true,
      "companyRegistrationCertificateUrl": "https://cdn.example.com/docs/company-reg-cert.pdf",
      "website": "https://sunrisepharma.example.com",
      "gstNumber": "27AAAPL1234C1ZV",
      "gstFileUrl": "https://cdn.example.com/docs/gst-certificate.pdf",
      "isGstVerified": false,
      "address": {
        "stateId": 1,
        "districtId": 1,
        "talukaId": 1,
        "city": "Mumbai",
        "street": "MG Road",
        "buildingNo": "12-A",
        "landmark": "Near City Hospital",
        "pinCode": "400001"
      },
      "coordinator": {
        "name": "Rahul Sharma",
        "designation": "Operations Manager",
        "email": "rahul.sharma@sunrisepharma.example.com",
        "mobile": "9876500000",
        "emailVerified": false,
        "phoneVerified": false
      },
      "bankDetails": {
        "bankName": "State Bank of India",
        "branch": "MG Road Branch",
        "ifscCode": "SBIN0001234",
        "accountNumber": "123456789012",
        "accountHolderName": "Sunrise Pharma Distributors",
        "bankDocumentFileUrl": "https://cdn.example.com/docs/cancelled-cheque.pdf"
      },
      "documents": [
        {
          "productTypeId": 1,
          "documentNumber": "DL-MH-2024-00123",
          "documentFileUrl": "https://cdn.example.com/docs/drug-license.pdf",
          "isDocumentVerified": false,
          "licenseIssueDate": "2024-01-15",
          "licenseExpiryDate": "2027-01-14",
          "licenseIssuingAuthority": "FDA Maharashtra"
        }
      ]
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });

      pm.test('Temp seller created and ID saved', function () {
          var jsonData = pm.response.json();
          if (jsonData.tempSellerId) {
              pm.collectionVariables.set('tempSellerId', jsonData.tempSellerId);
          }
      });
    language: text/javascript
settings: {}
order: 1000
