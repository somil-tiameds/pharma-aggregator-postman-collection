$kind: http-request
description: Returns net-quantity unit master values (e.g. ml, g, kg) scoped to category_id = 4 style filtering.
url: "{{baseUrl}}/net-quantity-units/{{categoryId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 44000
