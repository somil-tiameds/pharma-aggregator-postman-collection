$kind: http-request
description: Looks up a single molecule master value by exact name.
url: "{{baseUrl}}/molecules/byName?name=Paracetamol"
method: GET
queryParams:
  name: Paracetamol
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 28000
