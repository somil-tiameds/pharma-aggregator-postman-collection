$kind: http-request
description: Returns all age-group master values (e.g. Infant, Adult, Geriatric) used for supplement/food product attributes.
url: "{{baseUrl}}/ageGroup/getAll"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 1000
