$kind: http-request
description: Updates an existing product's details, scoped to the authenticated seller.
url: "{{baseUrl}}/products/update/{{productId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productName": "Paracetamol 500mg Tablets",
      "warningsPrecautions": "Do not exceed the stated dose. Consult a doctor if symptoms persist.",
      "productDescription": "Pain relief and fever reduction tablets, pack of 10 strips.",
      "manufacturerName": "Sunrise Pharma Distributors",
      "categoryId": 1,
      "packagingDetails": [
        {
          "packId": 1,
          "unitPerPack": 10,
          "packTypeUnitId": 1,
          "numberOfPacks": 100,
          "packSize": 10,
          "minimumOrderQuantity": 5,
          "maximumOrderQuantity": 500
        }
      ],
      "pricingDetails": [
        {
          "batchLotNumber": "BATCH-2026-001",
          "manufacturingDate": "2026-01-10T00:00:00",
          "expiryDate": "2028-01-10T00:00:00",
          "stockQuantity": 1000,
          "dateOfStockEntry": "2026-01-15",
          "sellingPrice": 25.5,
          "mrp": 30.0,
          "discountPercentage": 15.0,
          "gstPercentage": 12,
          "finalPrice": 29,
          "hsnCode": 30049099,
          "shelfLifeMonths": 24
        }
      ],
      "productAttributeDrugs": [
        {
          "therapeuticCategoryId": "1",
          "therapeuticSubcategoryId": "1",
          "dosageForm": "Tablet",
          "molecules": [],
          "storageConditionIds": [
            1
          ]
        }
      ],
      "productImages": []
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 4000
