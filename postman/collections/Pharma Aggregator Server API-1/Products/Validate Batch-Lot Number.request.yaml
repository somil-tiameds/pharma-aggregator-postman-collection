$kind: http-request
name: Validate Batch/Lot Number
description: Checks whether a batch/lot number is already used by the authenticated seller for the given product category, to prevent duplicate batch entries.
url: "{{baseUrl}}/pricing/validateBatchNumber?batchLotNumber=BATCH-2026-001&categoryId=1"
method: GET
queryParams:
  batchLotNumber: BATCH-2026-001
  categoryId: "1"
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 8000
