$kind: http-request
description: Marks the temp seller's company registration certificate as verified/unverified.
url: "{{baseUrl}}/temp-sellers/{{tempSellerId}}/verify/company-registration-certificate"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isCompanyRegistrationCertificateVerified": true
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 7000
