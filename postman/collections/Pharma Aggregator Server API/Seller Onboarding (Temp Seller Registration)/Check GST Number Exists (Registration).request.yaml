$kind: http-request
description: Checks whether a GST number is already registered, used for live validation during new seller registration.
url: "{{baseUrl}}/temp-sellers/coordinator/check-gstnumber?gstnumber=27AAAPL1234C1ZV"
method: GET
queryParams:
  gstnumber: 27AAAPL1234C1ZV
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 13000
