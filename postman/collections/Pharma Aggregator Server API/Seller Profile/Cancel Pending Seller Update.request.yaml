$kind: http-request
description: "Rollback endpoint: deletes a pending seller update record, used when the Step 2 document upload fails after Step 1 succeeded."
url: "{{baseUrl}}/sellers/pendingSellerId/{{pendingSellerId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 3000
