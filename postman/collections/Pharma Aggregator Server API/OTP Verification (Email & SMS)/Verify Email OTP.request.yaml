$kind: http-request
description: Verifies the OTP sent to an email address during seller registration.
url: "{{baseUrl}}/temp-seller/email-otp/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "rahul.sharma@sunrisepharma.example.com",
      "otp": "123456"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 3000
