$kind: http-request
description: Returns the lifetime total quantity debited (STOCK_OUT) for a product across all of its batches - useful for reconciling against Get Total Added.
url: "{{baseUrl}}/stock/{{productId}}/debited-total"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 9000
