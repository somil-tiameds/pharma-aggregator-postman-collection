$kind: http-request
description: Same as Add Stock, but scoped to one packaging/pack-size variant via packagingId (must already exist on this product, or 400 is returned). Use this once a product has more than one packaging variant, so the FIFO batch/stock tracking stays per-variant instead of ambiguous.
url: "{{baseUrl}}/stock/add"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": "{{productId}}",
      "packagingId": "{{packagingId}}",
      "batchLotNumber": "BATCH-2026-003",
      "manufacturingDate": "2026-02-01T00:00:00",
      "expiryDate": "2028-02-01T00:00:00",
      "quantity": 200,
      "mrp": 45.0,
      "sellingPrice": 39.0,
      "referenceId": "PO-2026-0418",
      "referenceType": "PURCHASE"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Ledger row is linked to the packaging variant', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('packagingId', pm.variables.get('packagingId'));
      });
    language: text/javascript
settings: {}
order: 2000
