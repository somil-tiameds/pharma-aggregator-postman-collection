$kind: http-request
description: Returns the lifetime total quantity added (STOCK_IN) for a product across all of its batches - useful for reconciling against Get Total Debited (added minus debited should equal Get Total Stock).
url: "{{baseUrl}}/stock/{{productId}}/added-total"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 10000
