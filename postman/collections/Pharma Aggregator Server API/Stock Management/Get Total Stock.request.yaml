$kind: http-request
description: Returns the current total stock quantity for a product, summed across all of its batches that still have remaining stock.
url: "{{baseUrl}}/stock/{{productId}}/total"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 7000
