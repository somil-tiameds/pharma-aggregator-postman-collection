$kind: http-request
description: Same as Debit Stock, but scoped to one packaging variant — FIFO only consumes batches under that packagingId, and insufficient-stock is checked against that variant's total only, not the whole product.
url: "{{baseUrl}}/stock/debit"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": "{{productId}}",
      "packagingId": "{{packagingId}}",
      "quantity": 50,
      "referenceId": "ORD-9002",
      "referenceType": "ORDER"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('All returned ledger rows belong to the requested packaging variant', function () {
          var jsonData = pm.response.json();
          jsonData.forEach(function (row) {
              pm.expect(row.packagingId).to.eql(pm.variables.get('packagingId'));
          });
      });
    language: text/javascript
settings: {}
order: 6000
