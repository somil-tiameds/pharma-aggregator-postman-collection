$kind: http-request
description: Instead of referencing an existing packagingId, submit full packagingDetails inline. The server reuses a matching variant if one already exists on this product (same packId+unitPerPack+numberOfPacks+min/maxOrderQuantity), otherwise creates it in the same call and links the new batch to it. Ignored if packagingId is also set.
url: "{{baseUrl}}/stock/add"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": "{{productId}}",
      "packagingDetails": {
        "packId": 1,
        "unitPerPack": 15,
        "packTypeUnitId": 1,
        "numberOfPacks": 100,
        "packSize": 15,
        "minimumOrderQuantity": 5,
        "maximumOrderQuantity": 500
      },
      "batchLotNumber": "BATCH-2026-004",
      "manufacturingDate": "2026-02-05T00:00:00",
      "expiryDate": "2028-02-05T00:00:00",
      "quantity": 300,
      "mrp": 42.0,
      "sellingPrice": 36.0,
      "referenceId": "PO-2026-0419",
      "referenceType": "PURCHASE"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response includes the resolved/created packagingId', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('packagingId').that.is.not.empty;
          pm.collectionVariables.set('packagingId', jsonData.packagingId);
      });
    language: text/javascript
settings: {}
order: 3000
