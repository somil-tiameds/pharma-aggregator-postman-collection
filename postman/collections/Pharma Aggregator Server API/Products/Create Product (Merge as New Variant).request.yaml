$kind: http-request
description: Run this AFTER 'Create Product' above, unchanged productName/manufacturerName/categoryId but a DIFFERENT packaging (strip of 15 instead of 10). Since seller+name+manufacturer+category match the existing product, no new product is created — this packaging becomes a second variant and this batch becomes a new batch, both attached to the SAME productId as before. Verify with 'Get Product by ID' that only one product exists, now with two packagingDetails entries.
url: "{{baseUrl}}/products/create"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productName": "Paracetamol 500mg Tablets",
      "warningsPrecautions": "Do not exceed the stated dose. Consult a doctor if symptoms persist.",
      "productDescription": "Pain relief and fever reduction tablets, pack of 10 strips.",
      "manufacturerName": "Sunrise Pharma Distributors",
      "categoryId": 1,
      "packagingDetails": [
        {
          "packId": 1,
          "unitPerPack": 15,
          "packTypeUnitId": 1,
          "numberOfPacks": 100,
          "packSize": 15,
          "minimumOrderQuantity": 5,
          "maximumOrderQuantity": 500
        }
      ],
      "pricingDetails": [
        {
          "batchLotNumber": "BATCH-2026-002",
          "manufacturingDate": "2026-01-12T00:00:00",
          "expiryDate": "2028-01-12T00:00:00",
          "stockQuantity": 500,
          "dateOfStockEntry": "2026-01-16",
          "sellingPrice": 36.0,
          "mrp": 42.0,
          "discountPercentage": 15.0,
          "gstPercentage": 12,
          "finalPrice": 41,
          "hsnCode": 30049099,
          "shelfLifeMonths": 24
        }
      ],
      "productAttributeDrugs": [
        {
          "therapeuticCategoryId": "1",
          "therapeuticSubcategoryId": "1",
          "dosageForm": "Tablet",
          "molecules": [],
          "storageConditionIds": [
            1
          ]
        }
      ],
      "productImages": []
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Same productId as the first Create Product call (merged, not duplicated)', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.productId).to.eql(pm.collectionVariables.get('productId'));
      });
    language: text/javascript
settings: {}
order: 2000
