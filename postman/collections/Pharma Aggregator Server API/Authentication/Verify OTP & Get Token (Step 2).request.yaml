$kind: http-request
description: "STEP 2: Validates the 6-digit OTP sent to email and issues a JWT access token + refresh token. Automatically saves 'access_token' and 'refresh_token' to collection variables for use in subsequent authenticated requests. Public endpoint."
url: "{{baseUrl}}/authentication/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "seller_admin",
      "otp": "123456"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });

      pm.test('Access token received and saved', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('accessToken');
          pm.collectionVariables.set('access_token', jsonData.accessToken);
          if (jsonData.refreshToken) {
              pm.collectionVariables.set('refresh_token', jsonData.refreshToken);
          }
          if (jsonData.userId) {
              pm.collectionVariables.set('user_id', jsonData.userId);
          }
      });
    language: text/javascript
settings: {}
order: 2000
