$kind: http-request
description: Verifies the OTP sent via forgot-password and returns a short-lived reset token used to authorize the actual password reset. Automatically saves 'reset_token' collection variable.
url: "{{baseUrl}}/auth/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "seller@example.com",
      "otp": "123456"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });

      pm.test('Reset token received and saved', function () {
          var jsonData = pm.response.json();
          if (jsonData.data && jsonData.data.resetToken) {
              pm.collectionVariables.set('reset_token', jsonData.data.resetToken);
          }
      });
    language: text/javascript
settings: {}
order: 7000
