$kind: http-request
name: Review Temp Seller (Accept/Reject/Correction)
description: Admin action on a temporary seller registration. status must be one of ACCEPT, REJECT, or CORRECTION.
url: "{{baseUrl}}/admin/sellers/review"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": 1,
      "status": "ACCEPT",
      "comments": "All documents verified successfully."
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 1000
