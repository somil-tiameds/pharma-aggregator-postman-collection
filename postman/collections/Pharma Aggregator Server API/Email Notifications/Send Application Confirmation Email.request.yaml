$kind: http-request
description: Sends a full application-confirmation email using the supplied application/seller/coordinator/address/bank/document details. Standalone endpoint with no dependency on stored TempSeller records.
url: "{{baseUrl}}/independent/email/send-confirmation"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "applicationRequestId": "APP-2026-000123",
      "submissionDate": "2026-07-01",
      "applicationStatus": "SUBMITTED",
      "sellerName": "Sunrise Pharma Distributors",
      "sellerEmail": "contact@sunrisepharma.example.com",
      "sellerPhone": "9876543210",
      "coordinatorName": "Rahul Sharma",
      "coordinatorEmail": "rahul.sharma@sunrisepharma.example.com",
      "coordinatorMobile": "9876500000",
      "coordinatorDesignation": "Operations Manager",
      "addressCity": "Mumbai",
      "addressStreet": "MG Road",
      "addressBuildingNo": "12-A",
      "addressLandmark": "Near City Hospital",
      "addressPinCode": "400001",
      "addressState": "Maharashtra",
      "addressDistrict": "Mumbai",
      "addressTaluka": "Mumbai City",
      "bankName": "State Bank of India",
      "bankBranch": "MG Road Branch",
      "bankIfscCode": "SBIN0001234",
      "bankAccountNumber": "123456789012",
      "bankAccountHolderName": "Sunrise Pharma Distributors",
      "gstNumber": "27AAAPL1234C1ZV",
      "documentNumber": "DL-MH-2024-00123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 1000
