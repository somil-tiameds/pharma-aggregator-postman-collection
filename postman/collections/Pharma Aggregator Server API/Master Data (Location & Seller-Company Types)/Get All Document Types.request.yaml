$kind: http-request
description: Returns the list of document type master values used to classify seller documents that aren't tied to a product category (e.g. Brand Owner Agreement, White Labeling Agreement, Distribution Agreement, PCD Agreement, Trademark Certificate, IEC Certificate, import licences).
url: "{{baseUrl}}/document-types"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 8000
