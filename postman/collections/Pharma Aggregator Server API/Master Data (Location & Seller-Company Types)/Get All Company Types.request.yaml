$kind: http-request
description: Returns the list of company type master values (e.g. Proprietorship, Partnership, Pvt Ltd) for seller onboarding forms.
url: "{{baseUrl}}/company-types"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 6000
