$kind: http-request
description: Looks up bank branch details for a given IFSC code, checking local override data first. Returns 404 if no override exists for the code.
url: "{{baseUrl}}/ifsc/{{ifscCode}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 10000
