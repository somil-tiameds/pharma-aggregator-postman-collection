$kind: http-request
description: Uploads a single product brochure PDF for a Cosmetic & Personal Care product attribute.
url: "{{baseUrl}}/product-documents/cosmetic/{{productAttributeId}}/brochure"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: brochureFile
      src: /path/to/brochure.pdf
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204]);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
settings: {}
order: 8000
