$kind: http-request
description: GET /lab-super-admin/stats/all — SuperAdminDashboardController.getAllStats. The slow one this collection exists to test/monitor.
url: "{{baseUrl}}/api/v1/lab-super-admin/stats/all?startDate={{startDate}}&endDate={{endDate}}&limit={{limit}}"
method: GET
headers:
  Authorization: Bearer {{token}}
queryParams:
  - key: startDate
    value: "{{startDate}}"
  - key: endDate
    value: "{{endDate}}"
  - key: limit
    value: "{{limit}}"
  - key: labId
    value: "{{labId}}"
    disabled: true
settings: {}
order: 1000
