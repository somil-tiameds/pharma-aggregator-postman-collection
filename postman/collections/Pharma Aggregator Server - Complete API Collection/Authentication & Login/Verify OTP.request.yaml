$kind: http-request
url: "{{baseUrl}}/auth/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "seller@example.com",
      "otp": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          pm.environment.set('resetToken', pm.response.json().data.resetToken);
      }
    language: text/javascript
settings: {}
order: 3000
