$kind: http-request
url: "{{baseUrl}}/product-document/upload"
method: POST
headers:
  Authorization: Bearer {{authToken}}
body:
  type: formdata
  content:
    - type: text
      key: productId
      value: "1"
    - type: file
      key: document
      src: ""
    - type: text
      key: documentType
      value: MSDS
settings: {}
order: 3000
