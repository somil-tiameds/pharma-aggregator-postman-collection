$kind: http-request
description: "No validation on drafts - every field optional. Note: field is `productTypeId` (a List<Long>) even though it's plural in meaning."
url: "{{baseUrl}}/temp-sellers/draft"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "sellerName": "Test Pharma Distributors",
      "companyTypeId": 1,
      "sellerTypeId": 1,
      "productTypeId": [1],
      "phone": "9876543210",
      "email": "seller@example.com",
      "gstNumber": "27AAECS1234A1Z5"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
        const body = pm.response.json();
        if (body.tempSellerId) pm.collectionVariables.set('tempSellerId', String(body.tempSellerId));
      }
    language: text/javascript
settings: {}
order: 1000
