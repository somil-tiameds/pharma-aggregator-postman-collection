$kind: http-request
url: "{{baseUrl}}/admin/sellers/review"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id": {{tempSellerId}},
      "status": "ACCEPT",
      "comments": "All documents verified, approving registration"
    }
settings: {}
order: 1000
