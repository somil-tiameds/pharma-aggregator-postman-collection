$kind: http-request
url: "{{baseUrl}}/admin/sellers/review"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id": {{tempSellerId}},
      "status": "CORRECTION",
      "comments": "Bank account number does not match cancelled cheque"
    }
settings: {}
order: 3000
