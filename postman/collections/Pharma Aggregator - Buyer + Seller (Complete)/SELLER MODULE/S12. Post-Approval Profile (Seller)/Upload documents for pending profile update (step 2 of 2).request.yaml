$kind: http-request
url: "{{baseUrl}}/sellers/{{pendingSellerId}}/documents/upload"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: gstFile
      src: ""
    - type: file
      key: bankFile
      src: ""
    - type: file
      key: companyRegistrationCertificate
      src: ""
    - type: file
      key: licenseFiles
      src: ""
    - type: text
      key: licenseNames
      value: Drug License
    - type: text
      key: documentIds
      value: "{{sellerDocumentId}}"
settings: {}
order: 2000
