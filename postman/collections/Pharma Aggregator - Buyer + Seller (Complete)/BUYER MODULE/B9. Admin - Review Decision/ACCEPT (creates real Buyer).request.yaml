$kind: http-request
description: Sets status APPROVED before the best-effort email/S3-migration step.
url: "{{baseUrl}}/admin/buyers/review"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id": {{tempBuyerId}},
      "status": "ACCEPT",
      "comments": "All documents verified, approving registration"
    }
settings: {}
order: 1000
