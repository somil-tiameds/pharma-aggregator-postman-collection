$kind: http-request
description: No validation on drafts. buyerUserId must be sent explicitly (no security-context user resolution for BuyerUser yet).
url: "{{baseUrl}}/temp-buyers/draft"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "organizationName": "Test Hospital",
      "buyerTypeId": 1,
      "buyerUserId": {{buyerUserId}}
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201 || pm.response.code === 200) {
        const body = pm.response.json();
        if (body.data && body.data.tempBuyerId) pm.collectionVariables.set('tempBuyerId', String(body.data.tempBuyerId));
      }
    language: text/javascript
settings: {}
order: 1000
