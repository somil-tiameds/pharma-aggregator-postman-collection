url: "{{baseUrl}}/lab/{{labId}}/update-patient-details/{{patientId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "firstName": "Rahul",
      "lastName": "Sharma",
