$kind: http-request
description: Resets user password using a valid reset token. Invalidates all existing sessions by incrementing token version. Password must be 8-128 chars and differ from current password.
url: "{{baseUrl}}/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "token": "{{token}}",
      "newPassword": "NewSecure@12345",
      "confirmPassword": "NewSecure@12345"
    }
settings: {}
order: 9000
