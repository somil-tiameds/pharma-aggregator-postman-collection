$kind: http-example
request:
  url: "{{baseUrl}}/auth/verify-otp"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "email": "admin@example.com",
        "otp": "123456"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
    - key: Set-Cookie
      value: access_token=eyJhbGc...; HttpOnly; Secure; SameSite=Strict
    - key: Set-Cookie
      value: refresh_token=eyJhbGc...; HttpOnly; Secure; SameSite=Strict
  body:
    type: text
    content: |-
      {
        "status": "success",
        "message": "OTP verified successfully",
        "data": {
          "username": "johndoe",
          "email": "admin@example.com",
          "firstName": "John",
          "lastName": "Doe",
          "roles": ["ROLE_ADMIN"],
          "is_verified": true,
          "modules": [{"id": 1, "name": "Lab Module"}],
          "phone": "+91-9876543210",
          "address": "123 Main St",
          "city": "Mumbai",
          "state": "Maharashtra",
          "zip": "400001",
          "country": "India",
          "enabled": true
        }
      }
order: 1000
