$kind: http-request
description: Approve multiple pending seller requests in batch
url: "{{baseUrl}}/admin/seller-requests/batch-approve?approvedBy={{adminId}}"
method: POST
headers:
  Authorization: Bearer {{authToken}}
  Content-Type: application/json
queryParams:
  approvedBy: "{{adminId}}"
body:
  type: text
  content: "[1, 2, 3, 4, 5]"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          pm.test('Batch approval successful', function() {
              pm.expect(pm.response.text()).to.include('successfully');
          });
      }
    language: text/javascript
settings: {}
order: 6000
