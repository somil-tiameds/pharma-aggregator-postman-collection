$kind: http-request
description: Approve a pending seller request and move to active sellers
url: "{{baseUrl}}/admin/seller-requests/{{pendingSellerId}}/approve?approvedBy={{adminId}}"
method: POST
headers:
  Authorization: Bearer {{authToken}}
  Content-Type: application/json
queryParams:
  approvedBy: "{{adminId}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          pm.test('Approval successful', function() {
              var jsonData = pm.response.json();
              pm.expect(jsonData.status).to.equal('SUCCESS');
          });
      }
    language: text/javascript
settings: {}
order: 4000
