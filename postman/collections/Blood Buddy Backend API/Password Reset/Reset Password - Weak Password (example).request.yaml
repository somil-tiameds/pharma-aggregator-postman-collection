$kind: http-request
description: "Negative test: `newPassword` fails the strength regex (needs letter + digit + special char, min 8 chars) — expects a 400 validation error."
url: "{{baseUrl}}/password/reset"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "newPassword": "weak",
      "confirmPassword": "weak"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400 (weak password rejected)", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
settings: {}
order: 2000
