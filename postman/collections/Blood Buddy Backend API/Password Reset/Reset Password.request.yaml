$kind: http-request
description: |-
  Resets the password for the account identified by email.

  **Controller:** `PasswordresetController`
  **Method:** POST
  **Auth:** None

  **Request body (`ResetPasswordRequest`):**
  - `email`: required
  - `newPassword`: required, min 8 chars, must contain at least one letter, one digit, and one special character (`@$!%*#?&`)
  - `confirmPassword`: required (should match `newPassword`; matching is enforced in `PasswordService`)

  **Success response (200):** plain text/string message from `PasswordService.resetPassword`, e.g.
  ```
  Password reset successful
  ```

  **Validation error (400):** thrown when `newPassword` fails the pattern or is blank, or when passwords do not match (service-level check).
url: "{{baseUrl}}/password/reset"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "newPassword": "NewPass@123",
      "confirmPassword": "NewPass@123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 400", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 400]);
      });
    language: text/javascript
settings: {}
order: 1000
