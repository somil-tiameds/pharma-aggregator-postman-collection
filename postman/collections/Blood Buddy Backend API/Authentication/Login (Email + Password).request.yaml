$kind: http-request
description: |-
  Authenticates a blood centre user via email and password.

  **Controller:** `LoginController`
  **Method:** POST
  **Auth:** None (no JWT is issued by this endpoint in the current implementation)

  **Request body (`LoginRequest`):**
  - `email`: required, valid email
  - `password`: required

  **Success response (200) — `LoginResponse`:**
  ```json
  { "message": "Login successful", "email": "testcentre@bloodbuddy.com" }
  ```

  **Validation error (400):** field-level errors from `@Valid` when email/password are blank or malformed.

  **Note:** Since `LoginResponse` carries no token, downstream calls in this collection do not send an Authorization header — the backend currently permits all requests unauthenticated.
url: "{{baseUrl}}/login/mail-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 400", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 400, 401]);
      });
      if (pm.response.code === 200) {
          const json = pm.response.json();
          pm.collectionVariables.set("loggedInEmail", json.email);
      }
    language: text/javascript
settings: {}
order: 1000
